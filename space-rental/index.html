<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학교 공간 대여</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f0e8; --card: #fffdf8; --ink: #1b2333; --sub: #5d6778; --line: #d9d2c3; --soft: #ebe6da;
  --brand: #1f3a5f; --brand-ink: #ffffff; --brand-soft: #e3eaf3;
  --free: #1f7350; --free-bg: #dff0e6;
  --busy: #a83f31; --busy-bg: #f6dfda;
  --wait: #8a5d00; --wait-bg: #f7e9c2;
  --mine: #1f3a5f; --mine-bg: #dbe6f5;
  --grid: rgba(31, 58, 95, .07);
  --shadow: 0 1px 2px rgba(27, 35, 51, .06), 0 8px 24px rgba(27, 35, 51, .08);
  --display: 'Hahmlet', 'Noto Serif KR', serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c; --card: #1a2029; --ink: #e9ecf2; --sub: #9aa4b5; --line: #2e3745; --soft: #232b37;
    --brand: #9fc0ec; --brand-ink: #10203a; --brand-soft: #22324a;
    --free: #72cfa2; --free-bg: #173427;
    --busy: #f29384; --busy-bg: #3f211d;
    --wait: #e8c05f; --wait-bg: #3a2f12;
    --mine: #9fc0ec; --mine-bg: #22324a;
    --grid: rgba(159, 192, 236, .07);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* ----- 머리 ----- */
.top { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); padding: max(10px, env(safe-area-inset-top)) 16px 10px; }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
.brand { min-width: 0; flex: 1; }
.brand small { display: block; font-size: 12px; letter-spacing: .08em; opacity: .8; }
.brand h1 { font: 700 20px/1.25 var(--display); }
.who { font-size: 13px; text-align: right; line-height: 1.3; opacity: .95; }
.who b { display: block; font-weight: 600; }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 12px; font-weight: 500; flex: 1; border-radius: 10px; position: relative; }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .n { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--busy); color: #fff; border-radius: 99px; font-size: 11px; min-width: 18px; padding: 0 5px; line-height: 18px; }
.nav.bottom { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px max(6px, env(safe-area-inset-bottom)); color: var(--sub); }
.nav.bottom button.on { color: var(--brand); background: var(--brand-soft); }
.nav.inline { display: none; }
main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 110px; }

/* ----- 공통 ----- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--sub); }
.title { font: 700 22px/1.3 var(--display); }
.sub { color: var(--sub); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; font-weight: 500; min-height: 44px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.danger { color: var(--busy); border-color: var(--busy); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 14px; font-size: 14px; white-space: nowrap; min-height: 38px; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--soft); margin: 0 6px 6px 0; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.badge.ok { background: var(--free-bg); color: var(--free); }
.badge.wait { background: var(--wait-bg); color: var(--wait); }
.badge.no { background: var(--busy-bg); color: var(--busy); }
.badge.dim { background: var(--soft); color: var(--sub); }
.notice { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.notice.warn { background: var(--wait-bg); color: var(--wait); }
.err { background: var(--busy-bg); color: var(--busy); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
.empty { text-align: center; color: var(--sub); padding: 40px 16px; }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin: 14px 0 6px; }
input.in, select.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; margin: 60px auto; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .sheet { transition: none !important; } }

/* ----- 날짜·교시 고르기 ----- */
.ctl { margin-bottom: 14px; }
.datebar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.datebar .btn { padding: 0 12px; }
.datebar input { flex: 1; min-width: 150px; max-width: 220px; }
.datebar .dlabel { font-weight: 600; margin-left: 6px; font-size: 14px; }

/* ----- 건물 단면 ----- */
.mapgrid { display: grid; gap: 14px; }
.bldg-card { padding: 16px; }
.btabs { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
.bldg { border: 2px solid var(--ink); border-radius: 4px 4px 0 0; border-bottom-width: 6px; position: relative; margin-top: 18px; }
.bldg::before { content: ''; position: absolute; left: -8px; right: -8px; top: -12px; height: 10px; background: var(--ink); border-radius: 3px 3px 0 0; }
.fl { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; text-align: left; min-height: 52px; }
.fl:last-child { border-bottom: 0; }
.fl b { font: 700 16px var(--display); }
.fl em { font-style: normal; font-size: 13px; color: var(--sub); white-space: nowrap; }
.fl.on { background: var(--brand); color: var(--brand-ink); }
.fl.on em { color: inherit; opacity: .85; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid; }
.dot.free { background: var(--free-bg); border-color: var(--free); }
.dot.busy { background: var(--busy); border-color: var(--busy); }
.dot.wait { background: var(--wait-bg); border-color: var(--wait); }
.dot.part { background: linear-gradient(135deg, var(--free-bg) 50%, var(--busy) 50%); border-color: var(--sub); }
.dot.off { border-style: dashed; border-color: var(--sub); opacity: .55; background: transparent; }
.fl.on .dot { box-shadow: 0 0 0 1.5px var(--brand-ink); border-color: transparent; }

/* ----- 층 배치도 ----- */
.plan-card { padding: 16px; }
.plan { margin-top: 12px; border: 2px solid var(--ink); border-radius: 6px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 10px; }
.room { text-align: left; border: 2px solid; border-radius: 6px; padding: 10px; min-height: 108px; display: flex; flex-direction: column; gap: 2px; background: var(--card); }
.room .rn { font-weight: 600; line-height: 1.3; }
.room .rc { font-size: 13px; color: var(--sub); }
.room .st { margin-top: auto; font-size: 13px; font-weight: 600; }
.room.free { border-color: var(--free); background: var(--free-bg); } .room.free .st { color: var(--free); }
.room.busy { border-color: var(--busy); background: var(--busy-bg); } .room.busy .st { color: var(--busy); }
.room.wait { border-color: var(--wait); background: var(--wait-bg); } .room.wait .st { color: var(--wait); }
.room.part { border-color: var(--sub); }
.room.mine { border-color: var(--mine); background: var(--mine-bg); } .room.mine .st { color: var(--mine); }
.room.off { border-style: dashed; border-color: var(--line); background: transparent; color: var(--sub); }
.strip { display: flex; gap: 2px; margin: 6px 0 4px; }
.strip i { flex: 1; height: 6px; border-radius: 2px; background: var(--free); opacity: .35; }
.strip i.busy { background: var(--busy); opacity: 1; }
.strip i.wait { background: var(--wait); opacity: 1; }
.strip i.mine { background: var(--mine); opacity: 1; }
.corridor { border-top: 2px dashed var(--ink); text-align: center; font-size: 12px; letter-spacing: .3em; color: var(--sub); padding: 6px; background: var(--card); border-radius: 0 0 4px 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ----- 시트 (상세·신청) ----- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 22, .5); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 94dvh; background: var(--card); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 18px 10px; }
.sheet-head .grow { flex: 1; min-width: 0; }
.x { border: 0; background: var(--soft); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.sheet-body { overflow-y: auto; padding: 0 18px; -webkit-overflow-scrolling: touch; }
.sheet-body > :last-child:not(.sticky-go) { margin-bottom: max(20px, env(safe-area-inset-bottom)); }
.gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px 12px; padding: 0 18px; }
.gallery img { height: 210px; min-width: 120px; max-width: 86%; border-radius: 12px; scroll-snap-align: center; object-fit: cover; background: var(--soft); flex: none; }
.nophoto { height: 120px; border-radius: 12px; display: grid; place-items: center; color: var(--sub); font-size: 14px; margin-bottom: 12px; background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 10px, transparent 10px, transparent 20px); border: 1px dashed var(--line); }
.video { position: relative; padding-top: 56.25%; margin: 10px 0; border-radius: 12px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.facts { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin: 14px 0; font-size: 15px; }
.facts dt { color: var(--sub); font-size: 13px; font-weight: 600; padding-top: 2px; }
.facts dd { margin: 0; }
.sec { font: 700 17px var(--display); margin: 22px 0 8px; }
.prow { display: grid; grid-template-columns: 22px 78px 1fr; gap: 8px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; min-height: 50px; }
.prow .pn { font-weight: 600; }
.prow .pt { font-size: 12px; color: var(--sub); display: block; font-weight: 400; }
.prow .ps { font-size: 14px; }
.prow .box { width: 20px; height: 20px; border: 2px solid var(--free); border-radius: 5px; display: grid; place-items: center; font-size: 14px; line-height: 1; color: var(--brand-ink); }
.prow.free .ps { color: var(--free); }
.prow.sel { border-color: var(--brand); background: var(--brand-soft); }
.prow.sel .box { background: var(--brand); border-color: var(--brand); }
.prow.busy, .prow.wait { background: var(--soft); cursor: default; }
.prow.busy .box, .prow.wait .box { border-color: var(--line); background: var(--line); }
.prow.busy .ps { color: var(--busy); } .prow.wait .ps { color: var(--wait); }
.switch { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-weight: 600; }
.switch input { width: 22px; height: 22px; accent-color: var(--brand); }
.repeat { border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px 14px; margin-top: 10px; }
.days .chip { min-width: 44px; padding: 7px 0; text-align: center; }
.sticky-go { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 18px max(14px, env(safe-area-inset-bottom)); margin: 16px -18px 0; }
.clist { margin: 8px 0; padding-left: 20px; font-size: 14px; }

/* ----- 추천 ----- */
.findgrid { display: grid; gap: 14px; }
.pad { padding: 18px; }
.rec { padding: 16px; margin-bottom: 12px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.rank { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 17px var(--display); }
.rec.miss .rank { background: var(--soft); color: var(--sub); }
.rec h3 { font-size: 17px; font-weight: 600; }
.why { list-style: none; padding: 0; margin: 8px 0; font-size: 14px; }
.why li { padding-left: 22px; position: relative; margin-bottom: 3px; }
.why li::before { position: absolute; left: 0; font-weight: 700; }
.why li.y::before { content: '✓'; color: var(--free); }
.why li.n::before { content: '!'; color: var(--wait); left: 4px; }

/* ----- 목록 (내 예약·관리) ----- */
.item { padding: 14px 16px; margin-bottom: 10px; }
.item h3 { font-size: 16px; font-weight: 600; }
.item .meta { font-size: 14px; color: var(--sub); margin-top: 2px; }
.item .acts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.drow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.drow .grow { flex: 1; min-width: 120px; }
.drow.dim { opacity: .6; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.hrow { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hrow:first-child { border-top: 0; }
.hrow .when { color: var(--sub); font-size: 13px; }
.hrow details { margin-top: 4px; font-size: 13px; color: var(--sub); }
.hrow pre { white-space: pre-wrap; margin: 4px 0; font: 12px/1.5 ui-monospace, monospace; background: var(--soft); padding: 8px; border-radius: 8px; }
details.more > summary { cursor: pointer; color: var(--sub); padding: 10px 0; font-weight: 600; }

#toast { position: fixed; z-index: 60; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
#toast.on { opacity: 1; }

@media (min-width: 900px) {
  .nav.bottom { display: none; }
  .nav.inline { display: flex; }
  .nav.inline button { flex-direction: row; gap: 8px; padding: 8px 14px; font-size: 15px; color: inherit; opacity: .8; flex: none; }
  .nav.inline button.on { background: rgba(255, 255, 255, .16); opacity: 1; }
  .nav.inline .n { position: static; }
  main { padding: 24px 24px 60px; }
  .mapgrid { grid-template-columns: 340px 1fr; align-items: start; }
  .bldg-card { position: sticky; top: 84px; }
  .findgrid { grid-template-columns: 380px 1fr; align-items: start; }
  .sheet { left: auto; top: 0; width: 540px; max-height: none; border-radius: 0; }
  .sheet.small { top: 50%; left: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: 440px; border-radius: 18px; max-height: 86vh; }
  #toast { bottom: 32px; }
  .chips.scroll { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
}
</style>
</head>
<body>
<div id="app"><div class="spin" role="status" aria-label="불러오는 중"></div></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<!--PREVIEW-->
<script>
'use strict';

/* ---------- 상태 ---------- */
var S = {
  init: null, view: 'map', date: '', period: 'all', building: '', floor: '',
  days: {}, sheet: null,
  find: { date: '', periods: [], people: '', purpose: '', facilities: [], keyword: '', results: null, busy: false, err: '' },
  mine: null,
  admin: { tab: 'pending', data: null, hist: null, q: '', from: '', to: '' },
  pendingCount: 0,
  photos: {}   // 드라이브 파일 ID → 서버가 읽어 준 그림(data: 주소) 또는 'fail'
};
var WD = ['일', '월', '화', '수', '목', '금', '토'];

/* ---------- 도구 ---------- */
function $(sel, el) { return (el || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function call(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (!(window.google && google.script && google.script.run)) {
      reject(new Error('서버에 연결할 수 없어요. 웹앱 주소로 열었는지 확인해 주세요.'));
      return;
    }
    var run = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(function (e) {
        reject(new Error(String((e && e.message) || e).replace(/^(Error|Exception):\s*/, '')));
      });
    if (typeof run[name] !== 'function') {
      reject(new Error("서버에 '" + name + "' 함수가 없어요. Code.gs 를 최신으로 올리고 새 버전으로 배포해 주세요."));
      return;
    }
    run[name].apply(run, args);
  });
}
function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { t.classList.remove('on'); }, 3200);
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function toDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fromDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(s, n) { var d = toDate(s); d.setDate(d.getDate() + n); return fromDate(d); }
function wd(s) { return toDate(s).getDay(); }
function fmt(s) { var d = toDate(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')'; }
function fmtShort(s) { var d = toDate(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
function floorNum(f) { var m = /^[Bb](\d+)$/.exec(f); return m ? -m[1] : (parseFloat(f) || 0); }
function floorLabel(f) { var m = /^[Bb](\d+)$/.exec(f); return m ? '지하 ' + m[1] + '층' : (/^\d+$/.test(f) ? f + '층' : f); }
function room(id) { return S.init.rooms.filter(function (r) { return r.id === id; })[0]; }
function roomLabel(r) { return r ? r.building + ' ' + floorLabel(r.floor) : ''; }
function pname(id) { var p = S.init.periods.filter(function (x) { return x.id === id; })[0]; return p ? p.name : id; }
function pnames(ids) { return ids.map(pname).join(', '); }
function buildings() {
  var out = [];
  S.init.rooms.forEach(function (r) { if (out.indexOf(r.building) < 0) out.push(r.building); });
  return out;
}
function floorsOf(b) {
  var out = [];
  S.init.rooms.forEach(function (r) { if (r.building === b && out.indexOf(r.floor) < 0) out.push(r.floor); });
  return out.sort(function (x, y) { return floorNum(y) - floorNum(x); });
}
function roomsOf(b, f) {
  return S.init.rooms.filter(function (r) { return r.building === b && r.floor === f; })
    .sort(function (x, y) { return x.order - y.order; });
}
function uniq(key) {
  var out = [];
  S.init.rooms.forEach(function (r) {
    if (r.bookable) r[key].forEach(function (v) { if (out.indexOf(v) < 0) out.push(v); });
  });
  return out;
}
function driveId(url) {
  var m = /drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/.exec(url);
  return m ? m[1] : '';
}
function photoHtml(url, alt) {
  var fid = driveId(url), got = fid && S.photos[fid];
  if (got === 'fail') return '<div class="nophoto" style="flex:none;width:86%;height:210px;margin:0">사진을 불러올 수 없어요</div>';
  return '<img src="' + esc(got || mediaImg(url)) + '" alt="' + esc(alt) + '" loading="lazy" referrerpolicy="no-referrer"' + (fid ? ' data-fid="' + esc(fid) + '"' : '') + '>';
}
function mediaImg(url) {
  var m = /drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/.exec(url);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200' : url;
}
function mediaVideo(url) {
  var y = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/.exec(url);
  if (y) return 'https://www.youtube.com/embed/' + y[1];
  var d = /drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/.exec(url);
  if (d) return 'https://drive.google.com/file/d/' + d[1] + '/preview';
  return /^https:\/\//.test(url) ? url : '';
}
function statusBadge(st) {
  var cls = st === '확정' ? 'ok' : st === '승인대기' ? 'wait' : st === '반려' ? 'no' : 'dim';
  return '<span class="badge ' + cls + '">' + esc(st === '승인대기' ? '승인 대기' : st) + '</span>';
}
function canBook() { return S.init.me.registered; }
function ppl(n) { return n ? ' · ' + n + '명' : ''; }

/* ---------- 데이터 ---------- */
function loadDay(date, force) {
  if (S.days[date] && !force) return Promise.resolve(S.days[date]);
  return call('getDay', date).then(function (list) { S.days[date] = list; return list; });
}
function bookingAt(roomId, date, pid) {
  var list = S.days[date] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].roomId === roomId && list[i].periods.indexOf(pid) >= 0) return list[i];
  }
  return null;
}
function slotClass(b) { return !b ? 'free' : b.mine ? 'mine' : b.status === '확정' ? 'busy' : 'wait'; }
function roomState(r) {
  if (!r.bookable) return { k: 'off', t: '신청 불가' };
  var ps = S.init.periods;
  if (S.period !== 'all') {
    var b = bookingAt(r.id, S.date, S.period);
    if (!b) return { k: 'free', t: '비어 있음' };
    if (b.mine) return { k: 'mine', t: b.status === '확정' ? '내 예약' : '내 신청 (승인 대기)' };
    return b.status === '확정' ? { k: 'busy', t: '사용 중' + (b.name ? ' · ' + b.name : '') } : { k: 'wait', t: '승인 대기' };
  }
  var n = ps.filter(function (p) { return bookingAt(r.id, S.date, p.id); }).length;
  if (!n) return { k: 'free', t: '종일 비어 있음' };
  if (n === ps.length) return { k: 'busy', t: '종일 예약' };
  return { k: 'part', t: n + '개 교시 예약' };
}
function refreshAfterWrite() {
  S.days = {};
  S.mine = null;
  S.admin.data = null;
  S.admin.hist = null;
  S.find.results = null;
  var jobs = [loadDay(S.date)];
  if (S.sheet && S.sheet.date && S.sheet.date !== S.date) jobs.push(loadDay(S.sheet.date));
  if (S.view === 'mine') jobs.push(loadMine());
  if (S.view === 'admin') jobs.push(loadAdmin());
  else if (S.init.me.admin) jobs.push(loadAdmin());
  return Promise.all(jobs);
}
function loadMine() { return call('myBookings').then(function (l) { S.mine = l; }); }
function loadAdmin() {
  return call('adminBookings', { from: S.admin.from, to: S.admin.to }).then(function (d) {
    S.admin.data = d;
    S.admin.from = d.from;
    S.admin.to = d.to;
    S.pendingCount = groupUp(d.pending).length;
  });
}
function loadHist() { return call('getHistory', S.admin.q).then(function (h) { S.admin.hist = h; }); }
function groupUp(list) {
  var map = {}, out = [];
  list.forEach(function (b) {
    var k = b.groupId || b.id;
    if (!map[k]) { map[k] = { key: k, items: [] }; out.push(map[k]); }
    map[k].items.push(b);
  });
  return out;
}

/* ---------- 그리기: 공간 (건물·층·배치도) ---------- */
function viewMap() {
  var me = S.init.me, st = S.init.settings;
  var h = '';
  if (!me.registered) {
    h += '<div class="notice warn">' + (me.email ? esc(me.email) + ' 계정은 등록되어 있지 않아요. ' : '로그인한 계정을 확인할 수 없어요. 학교 구글 계정으로 로그인해 주세요. ') +
      '공간 소개와 예약 현황은 볼 수 있지만, 신청하려면 관리자에게 계정 등록을 요청해 주세요.</div>';
  } else if (st.notice) {
    h += '<div class="notice">' + esc(st.notice) + '</div>';
  }
  h += '<section class="ctl">' + dateBar('date', S.date) +
    '<div class="chips scroll" id="periodchips" role="group" aria-label="교시 고르기">' +
    '<button type="button" class="chip ' + (S.period === 'all' ? 'on' : '') + '" data-a="period" data-p="all" aria-pressed="' + (S.period === 'all') + '">하루 전체</button>' +
    S.init.periods.map(function (p) {
      return '<button type="button" class="chip ' + (S.period === p.id ? 'on' : '') + '" data-a="period" data-p="' + esc(p.id) + '" aria-pressed="' + (S.period === p.id) + '">' + esc(p.name) + '</button>';
    }).join('') + '</div></section>';

  var bs = buildings();
  h += '<div class="mapgrid"><section class="card bldg-card"><p class="eyebrow">건물</p>' +
    '<div class="btabs">' + bs.map(function (b) {
      return '<button type="button" class="chip ' + (b === S.building ? 'on' : '') + '" data-a="building" data-b="' + esc(b) + '" aria-pressed="' + (b === S.building) + '">' + esc(b) + '</button>';
    }).join('') + '</div><div class="bldg">' +
    floorsOf(S.building).map(function (f) {
      var rs = roomsOf(S.building, f);
      var free = 0;
      var dots = rs.map(function (r) {
        var k = roomState(r).k;
        if (k === 'free' || k === 'part') free++;
        return '<span class="dot ' + (k === 'mine' ? 'busy' : k) + '"></span>';
      }).join('');
      return '<button type="button" class="fl ' + (f === S.floor ? 'on' : '') + '" data-a="floor" data-f="' + esc(f) + '" aria-pressed="' + (f === S.floor) + '">' +
        '<b>' + esc(floorLabel(f)) + '</b><span class="dots" aria-hidden="true">' + dots + '</span><em>쓸 수 있는 곳 ' + free + '</em></button>';
    }).join('') + '</div></section>';

  var list = roomsOf(S.building, S.floor);
  h += '<section class="card plan-card"><p class="eyebrow">' + esc(fmt(S.date)) + ' · ' + esc(S.period === 'all' ? '하루 전체' : pname(S.period)) + '</p>' +
    '<h2 class="title">' + esc(S.building + ' ' + floorLabel(S.floor)) + '</h2>' +
    '<p class="sub">공간을 누르면 소개를 보고 신청할 수 있어요.</p>' +
    '<div class="plan"><div class="rooms">' + list.map(roomCell).join('') + '</div><div class="corridor">복 도</div></div>' +
    '<div class="legend"><span><i class="dot free"></i>비어 있음</span><span><i class="dot busy"></i>사용 중</span>' +
    '<span><i class="dot wait"></i>승인 대기</span><span><i class="dot part"></i>일부 교시 예약</span><span><i class="dot off"></i>신청 불가</span></div>' +
    '</section></div>';
  return h;
}
function dateBar(kind, date) {
  var t = S.init.today;
  return '<div class="datebar"><button type="button" class="btn" data-a="shift" data-k="' + kind + '" data-d="-1" aria-label="이전 날"' + (date <= t ? ' disabled' : '') + '>‹</button>' +
    '<input class="in" type="date" data-date="' + kind + '" value="' + date + '" min="' + t + '" aria-label="날짜">' +
    '<button type="button" class="btn" data-a="shift" data-k="' + kind + '" data-d="1" aria-label="다음 날">›</button>' +
    (date !== t ? '<button type="button" class="btn" data-a="shift" data-k="' + kind + '" data-d="0">오늘</button>' : '') +
    '<span class="dlabel">' + esc(fmt(date)) + '</span></div>';
}
function roomCell(r) {
  var s = roomState(r);
  var strip = r.bookable ? '<span class="strip" aria-hidden="true">' + S.init.periods.map(function (p) {
    return '<i class="' + slotClass(bookingAt(r.id, S.date, p.id)) + '"></i>';
  }).join('') + '</span>' : '';
  return '<button type="button" class="room ' + s.k + '" data-a="room" data-id="' + esc(r.id) + '">' +
    '<span class="rn">' + esc(r.name) + '</span>' +
    (r.capacity ? '<span class="rc">정원 ' + r.capacity + '명</span>' : '') + strip +
    '<span class="st">' + esc(s.t) + '</span></button>';
}

/* ---------- 그리기: 시트 ---------- */
function renderSheet() {
  var root = $('#sheet-root');
  var old = $('.sheet-body', root);
  var top = old ? old.scrollTop : 0;
  if (!S.sheet) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
  var sh = S.sheet;
  var inner = sh.type === 'room' ? sheetRoom(sh) : sh.type === 'edit' ? sheetEdit(sh) : sh.type === 'cancel' ? sheetCancel(sh) : sheetReject(sh);
  root.innerHTML = '<div class="scrim" data-a="close"></div><div class="sheet ' + (sh.type === 'cancel' || sh.type === 'reject' ? 'small' : '') +
    '" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' + inner + '</div>';
  document.body.style.overflow = 'hidden';
  var body = $('.sheet-body', root);
  if (body && sh.keepScroll) body.scrollTop = top;
  sh.keepScroll = true;
}
function sheetHead(eyebrow, title) {
  return '<div class="sheet-head"><div class="grow"><p class="eyebrow">' + esc(eyebrow) + '</p><h2 class="title" id="sheet-title">' + esc(title) + '</h2></div>' +
    '<button type="button" class="x" data-a="close" aria-label="닫기">×</button></div>';
}
function periodRows(roomId, date, sel, ownId) {
  return S.init.periods.map(function (p) {
    var b = bookingAt(roomId, date, p.id);
    if (b && b.id === ownId) b = null;
    var on = sel.indexOf(p.id) >= 0;
    var k = b ? (b.status === '확정' ? 'busy' : 'wait') : (on ? 'sel' : 'free');
    var txt = b ? (b.status === '확정' ? '사용 중' : '승인 대기') + (b.mine ? ' · 내 예약' : b.name ? ' · ' + b.name : '') + (b.purpose ? ' · ' + b.purpose : '')
      : (on ? '선택함' : '비어 있음');
    return '<button type="button" class="prow ' + k + '" ' + (b ? 'disabled' : 'data-a="pick" data-p="' + esc(p.id) + '" aria-pressed="' + on + '"') + '>' +
      '<span class="box" aria-hidden="true">' + (on && !b ? '✓' : '') + '</span>' +
      '<span class="pn">' + esc(p.name) + '<span class="pt">' + esc(p.start) + (p.end ? '~' + esc(p.end) : '') + '</span></span>' +
      '<span class="ps">' + esc(txt) + '</span></button>';
  }).join('');
}
function repeatDates(sh) {
  if (!sh.f.repeat || !sh.f.until || sh.f.until < sh.date) return [];
  var out = [];
  for (var d = sh.date, i = 0; d <= sh.f.until && i < 400; d = addDays(d, 1), i++) {
    if (sh.f.days.indexOf(wd(d)) >= 0) out.push(d);
  }
  return out;
}
function sheetRoom(sh) {
  var r = room(sh.id);
  var h = sheetHead(roomLabel(r), r.name) + '<div class="sheet-body">';
  if (r.photos.length) {
    h += '<div class="gallery">' + r.photos.map(function (u, i) { return photoHtml(u, r.name + ' 사진 ' + (i + 1)); }).join('') + '</div>';
  } else {
    h += '<div class="nophoto">사진 준비 중</div>';
  }
  if (r.desc) h += '<p>' + esc(r.desc) + '</p>';
  var v = r.video ? mediaVideo(r.video) : '';
  if (v) {
    h += sh.video ? '<div class="video"><iframe src="' + esc(v) + '" title="' + esc(r.name) + ' 소개 영상" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>'
      : '<button type="button" class="btn wide" data-a="video" style="margin-top:10px">▶ 소개 영상 보기</button>';
  }
  h += '<dl class="facts">' +
    '<dt>수용 인원</dt><dd>' + (r.capacity ? r.capacity + '명' : '정보 없음') + '</dd>' +
    (r.uses.length ? '<dt>용도</dt><dd>' + r.uses.map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</dd>' : '') +
    (r.facilities.length ? '<dt>시설</dt><dd>' + r.facilities.map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('') + '</dd>' : '') +
    '</dl>';
  if (r.note) h += '<div class="notice warn"><b>특이사항</b> ' + esc(r.note) + '</div>';

  if (!r.bookable) return h + '<div class="notice">이 공간은 신청을 받지 않아요.</div></div>';

  h += '<h3 class="sec">예약 현황</h3>' + dateBar('sheet', sh.date);
  if (!S.days[sh.date]) return h + '<div class="spin"></div></div>';
  if (sh.confirm) return h + confirmHtml(sh) + '</div>';

  var book = canBook();
  h += '<p class="sub" style="margin-bottom:8px">' + (book ? '비어 있는 교시를 눌러 고른 뒤 아래에서 신청하세요.' : '등록된 계정만 신청할 수 있어요.') + '</p>';
  h += book ? periodRows(r.id, sh.date, sh.sel, null) : periodRows(r.id, sh.date, [], null).replace(/data-a="pick"/g, 'disabled');
  if (!book) return h + '</div>';

  if (sh.sel.length) {
    var f = sh.f;
    h += '<h3 class="sec">신청 내용</h3>' +
      '<p class="sub">' + esc(fmt(sh.date)) + ' · ' + esc(pnames(sh.sel)) + '</p>' +
      '<label class="f" for="f-purpose">사용 목적</label><input class="in" id="f-purpose" data-f="purpose" maxlength="100" placeholder="예: 과학 동아리 발표 준비" value="' + esc(f.purpose) + '">' +
      '<label class="f" for="f-people">사용 인원' + (r.capacity ? ' (정원 ' + r.capacity + '명)' : '') + '</label><input class="in" id="f-people" data-f="people" type="number" inputmode="numeric" min="1" ' + (r.capacity ? 'max="' + r.capacity + '"' : '') + ' value="' + esc(f.people) + '">' +
      '<label class="switch"><input type="checkbox" data-a="repeat" ' + (f.repeat ? 'checked' : '') + '> 일정 기간 동안 반복해서 신청</label>';
    if (f.repeat) {
      var ds = repeatDates(sh);
      h += '<div class="repeat"><label class="f">반복할 요일</label><div class="chips days" role="group" aria-label="반복할 요일">' +
        [1, 2, 3, 4, 5, 6, 0].map(function (d) {
          var on = f.days.indexOf(d) >= 0;
          return '<button type="button" class="chip ' + (on ? 'on' : '') + '" data-a="wday" data-d="' + d + '" aria-pressed="' + on + '">' + WD[d] + '</button>';
        }).join('') + '</div>' +
        '<div class="row"><div class="grow"><label class="f">시작일</label><input class="in" type="date" value="' + sh.date + '" disabled></div>' +
        '<div class="grow"><label class="f" for="f-until">종료일</label><input class="in" id="f-until" type="date" data-f="until" data-rerender="1" min="' + sh.date + '" value="' + esc(f.until) + '"></div></div>' +
        '<p class="sub" style="margin-top:10px">' + (ds.length ? '모두 <b>' + ds.length + '회</b> · ' + esc(fmtShort(ds[0])) + ' ~ ' + esc(fmtShort(ds[ds.length - 1])) : '요일과 종료일을 골라 주세요.') + '</p></div>';
    }
    if (S.init.me.role === '학생') h += '<p class="sub" style="margin-top:12px">학생 신청은 관리자 승인 뒤에 확정돼요.</p>';
    if (sh.err) h += '<div class="err" role="alert">' + esc(sh.err) + '</div>';
    h += '<div class="sticky-go"><button type="button" class="btn primary wide" data-a="submit" ' + (sh.busy ? 'disabled' : '') + '>' +
      (sh.busy ? '신청하는 중…' : pnames(sh.sel) + ' 신청하기') + '</button></div>';
  }
  return h + '</div>';
}

    '<button type="button" class="btn primary grow" data-a="submit" data-skip="1" ' + (sh.busy ? 'disabled' : '') + '>' + c.okCount + '회만 신청</button></div>';

function sheetEdit(sh) {

function groupCard(g, admin) {

function viewMine() {
  if (!S.init.me.registered) return '<div class="card empty">등록된 계정만 예약할 수 있어요.</div>';
  if (!S.mine) return '<div class="spin"></div>';
  var today = S.init.today;

  if (past.length) {
    h += '<details class="more"><summary>지난 예약·취소·반려 ' + past.length + '건 (최근 30일)</summary>' + past.map(function (g) { return groupCard(g, false); }).join('') + '</details>';
  }
  return h;
}

/* ---------- 동작 ---------- */
function findBooking(id) {
  var pools = [S.mine || [], S.admin.data ? S.admin.data.list : [], S.admin.data ? S.admin.data.pending : []];
  for (var i = 0; i < pools.length; i++) {
    for (var j = 0; j < pools[i].length; j++) if (pools[i][j].id === id) return pools[i][j];
  }
  return null;
}
function fail(e) {
  if (S.sheet) { S.sheet.busy = false; S.sheet.err = e.message; renderSheet(); }
  else toast(e.message);
}
function setDate(kind, date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  if (date < S.init.today) date = S.init.today;
  if (kind === 'sheet' && S.sheet) {
    S.sheet.date = date; S.sheet.sel = []; S.sheet.err = ''; S.sheet.confirm = null;
    if (S.sheet.f.repeat) { S.sheet.f.days = [wd(date)]; if (S.sheet.f.until < date) S.sheet.f.until = addDays(date, 28); }
    renderSheet();
    loadDay(date).then(renderSheet, fail);
  } else {
    S.date = date;
    render();
    loadDay(date).then(render, fail);
  }
}
function openRoom(id, opt) {
  opt = opt || {};
  var date = opt.date || S.date;
  S.sheet = {
    type: 'room', id: id, date: date, sel: (opt.periods || []).slice(), video: false, err: '', busy: false, confirm: null,
    f: { purpose: opt.purpose || '', people: opt.people || '', repeat: false, days: [wd(date)], until: addDays(date, 28) }
  };
  if (S.period !== 'all' && !opt.periods && !bookingAt(id, date, S.period)) S.sheet.sel = [S.period];
  renderSheet();
  loadDay(date).then(function () {
    if (!S.sheet || S.sheet.id !== id) return;
    S.sheet.sel = S.sheet.sel.filter(function (p) { return !bookingAt(id, date, p); });
    renderSheet();
  }, fail);
}

var A = {
  view: function (el) {
    S.view = el.dataset.v;
    S.sheet = null;
    render();
    window.scrollTo(0, 0);
    if (S.view === 'mine' && !S.mine && S.init.me.registered) loadMine().then(render, fail);
    if (S.view === 'admin') {
      if (!S.admin.data) loadAdmin().then(render, fail);
      if (S.admin.tab === 'hist' && !S.admin.hist) loadHist().then(render, fail);
    }
    if (S.view === 'find' && !S.find.date) { S.find.date = S.date; render(); }
  },
  shift: function (el) {
    var k = el.dataset.k, d = +el.dataset.d;
    var cur = k === 'sheet' ? S.sheet.date : S.date;
    setDate(k, d === 0 ? S.init.today : addDays(cur, d));
  },
  period: function (el) { S.period = el.dataset.p; render(); },
  building: function (el) {
    S.building = el.dataset.b;
    var fs = floorsOf(S.building);
    S.floor = fs.indexOf('1') >= 0 ? '1' : fs[fs.length - 1];
    render();
  },
  floor: function (el) {
    S.floor = el.dataset.f;
    render();
    if (window.innerWidth < 900) { var p = $('.plan-card'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  },
  room: function (el) { openRoom(el.dataset.id); },
  close: function () { S.sheet = null; renderSheet(); },
  video: function () { S.sheet.video = true; renderSheet(); },
  pick: function (el) {
    var sel = S.sheet.sel, p = el.dataset.p, i = sel.indexOf(p);
    if (i >= 0) sel.splice(i, 1); else sel.push(p);
    var order = S.init.periods.map(function (x) { return x.id; });
    sel.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
    S.sheet.err = '';
    renderSheet();
  },
  repeat: function (el) { S.sheet.f.repeat = el.checked; renderSheet(); },
  wday: function (el) {
    var d = +el.dataset.d, days = S.sheet.f.days, i = days.indexOf(d);
    if (i >= 0) days.splice(i, 1); else days.push(d);
    renderSheet();
  },
  unconfirm: function () { S.sheet.confirm = null; S.sheet.err = ''; renderSheet(); },
  submit: function (el) {
    var sh = S.sheet, f = sh.f;
    if (!String(f.purpose).trim()) { sh.err = '사용 목적을 적어 주세요.'; renderSheet(); return; }
    if (!(parseInt(f.people, 10) >= 1)) { sh.err = '사용 인원을 숫자로 적어 주세요.'; renderSheet(); return; }
    sh.busy = true; sh.err = '';
    renderSheet();
    call('createBooking', {
      roomId: sh.id, date: sh.date, periods: sh.sel, purpose: f.purpose, people: f.people,
      repeat: f.repeat ? { until: f.until, weekdays: f.days } : null,
      skipConflicts: !!el.dataset.skip
    }).then(function (r) {
      sh.busy = false;
      if (r.needConfirm) { sh.confirm = r; renderSheet(); return; }
      var n = r.created > 1 ? r.created + '회 ' : '';
      toast(r.status === '확정' ? n + '예약이 확정됐어요.' : n + '신청했어요. 관리자 승인을 기다려 주세요.');
      S.date = sh.date;
      S.sheet = null;
      return refreshAfterWrite().then(render);
    }).catch(fail);
  },
  edit: function (el) {
    var b = findBooking(el.dataset.id);
    if (!b) return;
    S.sheet = { type: 'edit', b: b, date: b.date, sel: b.periods.slice(), err: '', busy: false, f: { purpose: b.purpose, people: b.people } };
    renderSheet();
    loadDay(b.date).then(renderSheet, fail);
  },
  save: function () {
    var sh = S.sheet;
    sh.busy = true; sh.err = '';
    renderSheet();
    call('updateBooking', sh.b.id, { periods: sh.sel, purpose: sh.f.purpose, people: sh.f.people }).then(function (r) {
      toast(r.status === '승인대기' && sh.b.status === '확정' ? '수정했어요. 교시가 바뀌어 다시 승인을 기다려요.' : '수정했어요.');
      S.sheet = null;
      return refreshAfterWrite().then(render);
    }).catch(fail);
  },
  cancel: function (el) {
    var b = findBooking(el.dataset.id);
    if (b) { S.sheet = { type: 'cancel', b: b, err: '', busy: false, f: {} }; renderSheet(); }
  },
  'cancel-go': function (el) {
    var sh = S.sheet;
    sh.busy = true;
    renderSheet();
    call('cancelBooking', sh.b.id, el.dataset.scope).then(function (r) {
      toast(r.cancelled > 1 ? r.cancelled + '건을 취소했어요.' : '예약을 취소했어요.');
      S.sheet = null;
      return refreshAfterWrite().then(render);
    }).catch(fail);
  },
  approve: function (el) {
    el.disabled = true;
    call('decide', el.dataset.id, true, '', 'group').then(function (r) {
      toast(r.done > 1 ? r.done + '건을 승인했어요.' : '승인했어요.');
      return refreshAfterWrite().then(render);
    }).catch(function (e) { toast(e.message); el.disabled = false; });
  },
  reject: function (el) {
    var b = findBooking(el.dataset.id);
    if (!b) return;
    var items = S.admin.data.pending.filter(function (x) { return (x.groupId || x.id) === (b.groupId || b.id); });
    S.sheet = { type: 'reject', items: items, err: '', busy: false, f: { reason: '' } };
    renderSheet();
  },
  'reject-go': function () {
    var sh = S.sheet;
    sh.busy = true;
    renderSheet();
    call('decide', sh.items[0].id, false, sh.f.reason, 'group').then(function () {
      toast('반려했어요.');
      S.sheet = null;
      return refreshAfterWrite().then(render);
    }).catch(fail);
  },
  atab: function (el) {
    S.admin.tab = el.dataset.t;
    render();
    if (S.admin.tab === 'hist' && !S.admin.hist) loadHist().then(render, fail);
    else if (!S.admin.data) loadAdmin().then(render, fail);
  },
  fchip: function (el) {
    var f = S.find, k = el.dataset.k, v = el.dataset.v;
    if (k === 'purpose') f.purpose = f.purpose === v ? '' : v;
    else { var i = f[k].indexOf(v); if (i >= 0) f[k].splice(i, 1); else f[k].push(v); }
    render();
  },
  'rec-open': function (el) {
    var f = S.find;
    openRoom(el.dataset.id, { date: f.date, periods: f.periods, people: f.people, purpose: f.purpose });
  }
};

var FORMS = {
  find: function () {
    var f = S.find;
    if (!f.date) { f.err = '날짜를 골라 주세요.'; render(); return; }
    f.busy = true; f.err = '';
    render();
    call('recommend', { date: f.date, periods: f.periods, people: f.people, purpose: f.purpose, facilities: f.facilities, keyword: f.keyword })
      .then(function (list) {
        f.busy = false; f.results = list;
        render();
        if (window.innerWidth < 900) { var s = $('.findgrid > section'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        else window.scrollTo(0, 0);
      })
      .catch(function (e) { f.busy = false; f.err = e.message; render(); });
  },
  hist: function () { S.admin.hist = null; render(); loadHist().then(render, fail); },
  range: function () { S.admin.data = null; render(); loadAdmin().then(render, fail); }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled || (el.tagName === 'INPUT' && el.type === 'checkbox')) return;
  var fn = A[el.dataset.a];
  if (fn) fn(el);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.a === 'repeat') A.repeat(el);
  if (el.dataset.date) setDate(el.dataset.date, el.value);
  if (el.dataset.rerender) renderSheet();
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset.f && S.sheet) S.sheet.f[el.dataset.f] = el.value;
  if (el.dataset.find) S.find[el.dataset.find] = el.value;
  if (el.dataset.admin) S.admin[el.dataset.admin] = el.value;
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var fn = FORMS[e.target.dataset.form];
  if (fn) fn();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.sheet) A.close();
});

/* 드라이브 사진이 바로 열리지 않으면(공유가 제한된 파일) 서버에 대신 읽어 달라고 합니다. */
document.addEventListener('error', function (e) {
  var el = e.target;
  if (!el || el.tagName !== 'IMG' || !el.dataset.fid || el.dataset.tried) return;
  el.dataset.tried = '1';
  var fid = el.dataset.fid;
  var each = function (fn) { Array.prototype.forEach.call(document.querySelectorAll('img[data-fid="' + fid + '"]'), fn); };
  call('getPhoto', fid).then(function (src) {
    if (!src) throw new Error('empty');
    S.photos[fid] = src;
    each(function (img) { img.dataset.tried = '1'; img.src = src; });
  }).catch(function () {
    S.photos[fid] = 'fail';
    renderSheet();
  });
}, true);

/* 다른 사람의 신청이 보이도록 1분마다, 그리고 화면으로 돌아올 때 새로 읽습니다. */
function quietRefresh() {
  if (!S.init || document.hidden || S.view !== 'map' || (S.sheet && S.sheet.busy)) return;
  var before = JSON.stringify(S.days[S.date] || null);
  call('getDay', S.date).then(function (list) {
    S.days[S.date] = list;
    if (JSON.stringify(list) === before) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'SELECT') return;
    render();
  }).catch(function () {});
}
setInterval(quietRefresh, 60000);
document.addEventListener('visibilitychange', quietRefresh);

/* ---------- 시작 ---------- */
call('getInit').then(function (init) {
  S.init = init;
  S.date = init.today;
  var bs = buildings();
  S.building = bs[0] || '';
  var fs = floorsOf(S.building);
  S.floor = fs.indexOf('1') >= 0 ? '1' : (fs[fs.length - 1] || '');
  var cur = init.periods.filter(function (p) { return p.start && p.end && p.start <= init.now && init.now < p.end; })[0];
  S.period = cur ? cur.id : 'all';
  document.title = init.settings.school + ' 공간 대여';
  var jobs = [loadDay(S.date)];
  if (init.me.admin) jobs.push(loadAdmin());
  return Promise.all(jobs).then(render);
}).catch(function (e) {
  $('#app').innerHTML = '<main><div class="err" role="alert" style="margin-top:40px"><b>화면을 불러오지 못했어요.</b><br>' + esc(e.message) + '</div></main>';
});
</script>
