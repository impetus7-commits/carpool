<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학교 공간 대여</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 그린 파스텔 톤 */
  --bg: #f0f8f1; --card: #fcfefb; --ink: #1c3a29; --sub: #567062; --line: #cde3d2; --soft: #e2f1e5;
  --brand: #1c7c45; --brand-ink: #ffffff; --brand-soft: #d5efdc;
  --top-bg: #9fd8b1; --top-ink: #0f3520; --top-on: rgba(255, 255, 255, .55);
  --free: #1c7c45; --free-bg: #dcf3e2;
  --busy: #b0463c; --busy-bg: #fbe2dd;
  --wait: #866000; --wait-bg: #fcefc6;
  --mine: #2a6a8c; --mine-bg: #dcecf6;
  --grid: rgba(28, 124, 69, .08);
  --shadow: 0 1px 2px rgba(28, 58, 41, .05), 0 8px 24px rgba(28, 58, 41, .08);
  --display: 'Hahmlet', 'Noto Serif KR', serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1913; --card: #17231b; --ink: #e5f2e8; --sub: #9bb2a3; --line: #2a3d30; --soft: #203026;
    --brand: #8fd8a8; --brand-ink: #0e2a19; --brand-soft: #1f3b2a;
    --top-bg: #1b3526; --top-ink: #dcf3e2; --top-on: rgba(143, 216, 168, .2);
    --free: #84d6a2; --free-bg: #173624;
    --busy: #f29a8d; --busy-bg: #40221e;
    --wait: #e8c466; --wait-bg: #3a3012;
    --mine: #8fc6e8; --mine-bg: #1c3344;
    --grid: rgba(143, 216, 168, .07);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* ----- 머리 ----- */
.top { position: sticky; top: 0; z-index: 20; background: var(--top-bg); color: var(--top-ink); border-bottom: 1px solid var(--line); padding: max(10px, env(safe-area-inset-top)) 16px 10px; }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
.brand { min-width: 0; flex: 1; }
.brand small { display: block; font-size: 12px; letter-spacing: .08em; opacity: .8; }
.brand h1 { font: 700 20px/1.25 var(--display); }
.who { font-size: 13px; text-align: right; line-height: 1.3; opacity: .95; }
.who b { display: block; font-weight: 600; }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 12px; font-weight: 500; flex: 1; border-radius: 10px; position: relative; }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav .n { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--busy); color: var(--card); border-radius: 99px; font-size: 11px; min-width: 18px; padding: 0 5px; line-height: 18px; }
.nav.bottom { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px max(6px, env(safe-area-inset-bottom)); color: var(--sub); }
.nav.bottom button.on { color: var(--brand); background: var(--brand-soft); }
.nav.inline { display: none; }
.infobar { background: var(--brand-soft); border-bottom: 1px solid var(--line); font-size: 13px; padding: 6px 16px; }
.infobar > div { max-width: 1180px; margin: 0 auto; }
.help h3 { font: 700 17px var(--display); margin: 0; }
.help details { border-top: 1px solid var(--line); }
.help details:first-of-type { border-top: 0; }
.help summary { cursor: pointer; padding: 14px 0; font-weight: 600; }
.help ol, .help ul { margin: 0 0 14px; padding-left: 22px; }
.help li { margin-bottom: 6px; }
.help p { margin-bottom: 10px; }
main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 110px; }

/* ----- 공통 ----- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--sub); }
.title { font: 700 22px/1.3 var(--display); }
.sub { color: var(--sub); font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 14px; font-weight: 500; min-height: 44px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.danger { color: var(--busy); border-color: var(--busy); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 14px; font-size: 14px; white-space: nowrap; min-height: 38px; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.tag { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--soft); margin: 0 6px 6px 0; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.badge.ok { background: var(--free-bg); color: var(--free); }
.badge.wait { background: var(--wait-bg); color: var(--wait); }
.badge.no { background: var(--busy-bg); color: var(--busy); }
.badge.dim { background: var(--soft); color: var(--sub); }
.notice { background: var(--brand-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.notice.warn { background: var(--wait-bg); color: var(--wait); }
.err { background: var(--busy-bg); color: var(--busy); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 10px 0; }
.empty { text-align: center; color: var(--sub); padding: 40px 16px; }
label.f { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin: 14px 0 6px; }
input.in, select.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; margin: 60px auto; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .sheet { transition: none !important; } }

/* ----- 날짜·교시 고르기 ----- */
.ctl { margin-bottom: 14px; }
.datebar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.datebar .btn { padding: 0 12px; }
.datebar input { flex: 1; min-width: 150px; max-width: 220px; }
.datebar .dlabel { font-weight: 600; margin-left: 6px; font-size: 14px; }

/* ----- 건물 단면 ----- */
.mapgrid { display: grid; gap: 14px; }
.bldg-card { padding: 16px; }
.btabs { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
.bldg { border: 2px solid var(--ink); border-radius: 4px 4px 0 0; border-bottom-width: 6px; position: relative; margin-top: 18px; }
.bldg::before { content: ''; position: absolute; left: -8px; right: -8px; top: -12px; height: 10px; background: var(--ink); border-radius: 3px 3px 0 0; }
.fl { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 12px; text-align: left; min-height: 52px; }
.fl:last-child { border-bottom: 0; }
.fl b { font: 700 16px var(--display); }
.fl em { font-style: normal; font-size: 13px; color: var(--sub); white-space: nowrap; }
.fl.on { background: var(--brand); color: var(--brand-ink); }
.fl.on em { color: inherit; opacity: .85; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid; }
.dot.free { background: var(--free-bg); border-color: var(--free); }
.dot.busy { background: var(--busy); border-color: var(--busy); }
.dot.wait { background: var(--wait-bg); border-color: var(--wait); }
.dot.part { background: linear-gradient(135deg, var(--free-bg) 50%, var(--busy) 50%); border-color: var(--sub); }
.dot.off { border-style: dashed; border-color: var(--sub); opacity: .55; background: transparent; }
.fl.on .dot { box-shadow: 0 0 0 1.5px var(--brand-ink); border-color: transparent; }

/* ----- 층 배치도 ----- */
.plan-card { padding: 16px; }
.plan { margin-top: 12px; border: 2px solid var(--ink); border-radius: 6px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding: 10px; }
.room { text-align: left; border: 2px solid; border-radius: 6px; padding: 10px; min-height: 108px; display: flex; flex-direction: column; gap: 2px; background: var(--card); }
.room .rn { font-weight: 600; line-height: 1.3; }
.room .rc { font-size: 13px; color: var(--sub); }
.room .st { margin-top: auto; font-size: 13px; font-weight: 600; }
.room.free { border-color: var(--free); background: var(--free-bg); } .room.free .st { color: var(--free); }
.room.busy { border-color: var(--busy); background: var(--busy-bg); } .room.busy .st { color: var(--busy); }
.room.wait { border-color: var(--wait); background: var(--wait-bg); } .room.wait .st { color: var(--wait); }
.room.part { border-color: var(--sub); }
.room.mine { border-color: var(--mine); background: var(--mine-bg); } .room.mine .st { color: var(--mine); }
.room.off { border-style: dashed; border-color: var(--line); background: transparent; color: var(--sub); }
.strip { display: flex; gap: 2px; margin: 6px 0 4px; }
.strip i { flex: 1; height: 6px; border-radius: 2px; background: var(--free); opacity: .35; }
.strip i.busy { background: var(--busy); opacity: 1; }
.strip i.wait { background: var(--wait); opacity: 1; }
.strip i.mine { background: var(--mine); opacity: 1; }
.corridor { border-top: 2px dashed var(--ink); text-align: center; font-size: 12px; letter-spacing: .3em; color: var(--sub); padding: 6px; background: var(--card); border-radius: 0 0 4px 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ----- 시트 (상세·신청) ----- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 22, .5); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 94dvh; background: var(--card); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 18px 18px 10px; }
.sheet-head .grow { flex: 1; min-width: 0; }
.x { border: 0; background: var(--soft); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.sheet-body { overflow-y: auto; padding: 0 18px; -webkit-overflow-scrolling: touch; }
.sheet-body > :last-child:not(.sticky-go) { margin-bottom: max(20px, env(safe-area-inset-bottom)); }
.gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -18px 12px; padding: 0 18px; }
.gallery img { height: 210px; min-width: 120px; max-width: 86%; border-radius: 12px; scroll-snap-align: center; object-fit: cover; background: var(--soft); flex: none; }
.nophoto { height: 120px; border-radius: 12px; display: grid; place-items: center; color: var(--sub); font-size: 14px; margin-bottom: 12px; background: repeating-linear-gradient(135deg, var(--soft), var(--soft) 10px, transparent 10px, transparent 20px); border: 1px dashed var(--line); }
.video { position: relative; padding-top: 56.25%; margin: 10px 0; border-radius: 12px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.facts { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin: 14px 0; font-size: 15px; }
.facts dt { color: var(--sub); font-size: 13px; font-weight: 600; padding-top: 2px; }
.facts dd { margin: 0; }
.sec { font: 700 17px var(--display); margin: 22px 0 8px; }
.prow { display: grid; grid-template-columns: 22px 78px 1fr; gap: 8px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; min-height: 50px; }
.prow .pn { font-weight: 600; }
.prow .pt { font-size: 12px; color: var(--sub); display: block; font-weight: 400; }
.prow .ps { font-size: 14px; }
.prow .box { width: 20px; height: 20px; border: 2px solid var(--free); border-radius: 5px; display: grid; place-items: center; font-size: 14px; line-height: 1; color: var(--brand-ink); }
.prow.free .ps { color: var(--free); }
.prow.sel { border-color: var(--brand); background: var(--brand-soft); }
.prow.sel .box { background: var(--brand); border-color: var(--brand); }
.prow.busy, .prow.wait { background: var(--soft); cursor: default; }
.prow.busy .box, .prow.wait .box { border-color: var(--line); background: var(--line); }
.prow.busy .ps { color: var(--busy); } .prow.wait .ps { color: var(--wait); }
.prow.shared { border-color: var(--wait); } .prow.shared .ps { color: var(--wait); } .prow.shared .box { border-color: var(--wait); }
.switch { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-weight: 600; }
.switch input { width: 22px; height: 22px; accent-color: var(--brand); }
.repeat { border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px 14px; margin-top: 10px; }
.days .chip { min-width: 44px; padding: 7px 0; text-align: center; }
.sticky-go { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 18px max(14px, env(safe-area-inset-bottom)); margin: 16px -18px 0; }
.clist { margin: 8px 0; padding-left: 20px; font-size: 14px; }
.clist ul { padding-left: 16px; margin: 2px 0 6px; }

/* ----- 일정 요약 (주간·월간·분기) ----- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font: 700 20px var(--display); }
.stat span { font-size: 12px; color: var(--sub); }
.rangebar { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; }
.rangebar .lab { flex: 1; text-align: center; font-weight: 600; }
.wk { width: 100%; border-collapse: separate; border-spacing: 2px; table-layout: fixed; font-size: 11px; }
.wk th { font-weight: 600; color: var(--sub); padding: 4px 0; font-size: 12px; }
.wk th.pcol { width: 52px; text-align: left; }
.wk th button { border: 0; background: none; padding: 2px 0; width: 100%; font-weight: 600; color: var(--ink); line-height: 1.25; }
.wk th button small { display: block; font-weight: 400; color: var(--sub); }
.wk th.today button { color: var(--brand); }
.wk td { height: 40px; border-radius: 5px; background: var(--free-bg); padding: 2px 3px; overflow: hidden; line-height: 1.2; vertical-align: middle; text-align: center; word-break: break-all; }
.wk td div { max-height: 2.4em; overflow: hidden; }
.wk td.busy { background: var(--busy-bg); color: var(--busy); }
.wk td.wait { background: var(--wait-bg); color: var(--wait); }
.wk td.mine { background: var(--mine-bg); color: var(--mine); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal .dow { text-align: center; font-size: 12px; color: var(--sub); padding: 2px 0; }
.cal button, .cal .pad0 { border: 0; border-radius: 7px; min-height: 52px; padding: 4px 2px; background: var(--soft); display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 13px; }
.cal .pad0 { background: none; }
.cal button b { font-weight: 600; }
.cal button small { font-size: 11px; color: var(--sub); }
.cal button.h1 { background: var(--busy-bg); background: color-mix(in srgb, var(--busy) 16%, var(--card)); }
.cal button.h2 { background: var(--busy-bg); background: color-mix(in srgb, var(--busy) 32%, var(--card)); }
.cal button.h3 { background: var(--busy-bg); background: color-mix(in srgb, var(--busy) 50%, var(--card)); }
.cal button.h4 { background: var(--busy); color: var(--card); }
.cal button.h3 small, .cal button.h4 small { color: inherit; }
.cal button.today { outline: 2px solid var(--brand); outline-offset: -2px; }
.cal.mini button, .cal.mini .pad0 { min-height: 30px; padding: 2px 0; font-size: 12px; justify-content: center; }
.mcal button { background: var(--soft); }
.mcal button:disabled { opacity: 1; cursor: default; color: var(--sub); background: none; }
.mcal button.mk { background: var(--mine-bg); box-shadow: inset 0 0 0 1.5px var(--mine); color: var(--mine); }
.mcal button.mw { background: var(--wait-bg); box-shadow: inset 0 0 0 1.5px var(--wait); color: var(--wait); }
.mcal button.mk small, .mcal button.mw small { color: inherit; font-weight: 600; }
.mcal button.old { opacity: .6; }
.mcal button.pick { outline: 3px solid var(--brand); outline-offset: 1px; }
.qgrid { display: grid; gap: 16px; }
.qgrid h4 { margin: 0 0 6px; font: 700 15px var(--display); }
.heatkey { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); margin-top: 10px; }
.heatkey i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
.heatkey i.h1 { background: color-mix(in srgb, var(--busy) 16%, var(--card)); }
.heatkey i.h2 { background: color-mix(in srgb, var(--busy) 32%, var(--card)); }
.heatkey i.h3 { background: color-mix(in srgb, var(--busy) 50%, var(--card)); }
.heatkey i.h4 { background: var(--busy); }
.bars { list-style: none; padding: 0; margin: 6px 0 0; font-size: 14px; }
.bars li { margin-bottom: 6px; }
.barbtn { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 8px; align-items: center; width: 100%; border: 0; background: none; padding: 0; text-align: left; min-height: 36px; }
.barbtn.on .bar { outline: 2px solid var(--brand); }
.barbtn.on .bar i { background: var(--brand); opacity: .35; }
.barbtn:hover .bar { filter: brightness(.97); }
.dlist { border-left: 3px solid var(--brand); margin: 6px 0 12px 4px; padding-left: 10px; }
.dlist .drow { width: 100%; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.dlist .drow:first-of-type { border-top: 0; }
.yheat { display: grid; gap: 2px; }
.yrow { display: grid; grid-template-columns: 30px repeat(31, 1fr); gap: 1px; align-items: center; }
.yrow b { font-size: 12px; font-weight: 600; color: var(--sub); }
.yrow button, .yrow i { aspect-ratio: 1; border: 0; padding: 0; border-radius: 2px; background: var(--soft); min-width: 0; }
.yrow i { background: none; }
.yrow button.h1 { background: color-mix(in srgb, var(--busy) 16%, var(--card)); }
.yrow button.h2 { background: color-mix(in srgb, var(--busy) 32%, var(--card)); }
.yrow button.h3 { background: color-mix(in srgb, var(--busy) 50%, var(--card)); }
.yrow button.h4 { background: var(--busy); }
.yrow button.today { outline: 2px solid var(--brand); }
.bars .bar { background: var(--soft); border-radius: 6px; overflow: hidden; position: relative; min-height: 28px; display: flex; align-items: center; }
.bars .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand-soft); }
.bars .bar span { position: relative; padding: 2px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars em { font-style: normal; color: var(--sub); text-align: right; font-size: 13px; }

/* ----- 추천 ----- */
.findgrid { display: grid; gap: 14px; }
.pad { padding: 18px; }
.rec { padding: 16px; margin-bottom: 12px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.rank { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 17px var(--display); }
.rec.miss .rank { background: var(--soft); color: var(--sub); }
.rec h3 { font-size: 17px; font-weight: 600; }
.why { list-style: none; padding: 0; margin: 8px 0; font-size: 14px; }
.why li { padding-left: 22px; position: relative; margin-bottom: 3px; }
.why li::before { position: absolute; left: 0; font-weight: 700; }
.why li.y::before { content: '✓'; color: var(--free); }
.why li.n::before { content: '!'; color: var(--wait); left: 4px; }

/* ----- 목록 (내 예약·관리) ----- */
.item { padding: 14px 16px; margin-bottom: 10px; }

#toast { position: fixed; z-index: 60; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }

@media (min-width: 900px) {
  .nav.bottom { display: none; }

  main { padding: 24px 24px 60px; }
  .mapgrid { grid-template-columns: 340px 1fr; align-items: start; }
  .bldg-card { position: sticky; top: 84px; }
  .findgrid { grid-template-columns: 380px 1fr; align-items: start; }
  .sheet { left: auto; top: 0; width: 540px; max-height: none; border-radius: 0; }
  .sheet.small { top: 50%; left: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: 440px; border-radius: 18px; max-height: 86vh; }

<body>
<div id="app"><div class="spin" role="status" aria-label="불러오는 중"></div></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/**
 * 학교 공간 대여 — 순수 계산 (시트·로그인과 무관)
 * 날짜 계산, 예약 겹침 판단, 반복 날짜 펼치기, 공간 추천
 */

var ACTIVE_STATUS_ = ['확정', '승인대기'];
var WEEKDAY_NAMES_ = ['일', '월', '화', '수', '목', '금', '토'];

function splitList_(s) {
  return String(s == null ? '' : s).split(/[,\n;、]+/)
    .map(function (x) { return x.trim(); })
    .filter(Boolean);
}

/** 구글 드라이브 주소에서 파일 ID 를 꺼냅니다. 드라이브 주소가 아니면 '' */
function driveId_(url) {
  var m = /drive\.google\.com\/.*(?:\/d\/|[?&]id=)([\w-]{20,})/.exec(String(url || ''));
  return m ? m[1] : '';
}

function pad2_(n) { return (n < 10 ? '0' : '') + n; }

function toUtc_(s) {
  var p = String(s).split('-');
  return Date.UTC(+p[0], +p[1] - 1, +p[2]);
}

function fromUtc_(t) {
  var d = new Date(t);
  return d.getUTCFullYear() + '-' + pad2_(d.getUTCMonth() + 1) + '-' + pad2_(d.getUTCDate());
}

function isDate_(s) {
  return /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && fromUtc_(toUtc_(s)) === s;
}

function addDays_(s, n) { return fromUtc_(toUtc_(s) + n * 86400000); }

/** 0=일 … 6=토 */
function weekday_(s) { return new Date(toUtc_(s)).getUTCDay(); }

/** start~until 사이에서 weekdays(0~6)에 해당하는 날짜들 */
function expandDates_(start, until, weekdays) {
  var out = [];
  for (var d = start; d <= until; d = addDays_(d, 1)) {
    if (weekdays.indexOf(weekday_(d)) >= 0) out.push(d);
  }
  return out;
}

function isActive_(b) { return ACTIVE_STATUS_.indexOf(b.status) >= 0; }

/** want = {roomId, date, periods[]} 와 겹치는 살아 있는 예약들 */
function findConflicts_(bookings, want, excludeId) {
  return bookings.filter(function (b) {
    return isActive_(b) && b.id !== excludeId &&
      b.roomId === want.roomId && b.date === want.date &&
      b.periods.some(function (p) { return want.periods.indexOf(p) >= 0; });
  });
}

function looseMatch_(list, word) {
  var w = String(word).toLowerCase().replace(/\s+/g, '');
  if (!w) return false;
  return list.some(function (x) {
    var v = String(x).toLowerCase().replace(/\s+/g, '');
    return v && (v.indexOf(w) >= 0 || w.indexOf(v) >= 0);
  });
}

/**
 * 공간 추천.
 * q = {periods[], people, purpose, facilities[], keyword}
 * dayBookings = 해당 날짜의 예약들, periods = [{id,name}]
 * 반환: [{roomId, ok, score, reasons[], warnings[]}] — 조건에 맞는 것부터, 점수 높은 순
 */
function recommend_(rooms, dayBookings, periods, q) {
  var nameOf = {};
  periods.forEach(function (p) { nameOf[p.id] = p.name; });
  var want = (q.periods || []).filter(function (p) { return nameOf[p]; });
  var people = Math.max(0, parseInt(q.people, 10) || 0);
  var purpose = String(q.purpose || '').trim();
  var needs = (q.facilities || []).filter(Boolean);
  var words = String(q.keyword || '').split(/[\s,]+/).filter(Boolean);

  var out = [];
  rooms.forEach(function (r) {
    if (!r.bookable) return;
    var x = { roomId: r.id, ok: true, score: 0, reasons: [], warnings: [] };

    if (want.length) {
      var busy = {};
      dayBookings.forEach(function (b) {
        if (isActive_(b) && b.roomId === r.id) b.periods.forEach(function (p) { busy[p] = true; });
      });
      var taken = want.filter(function (p) { return busy[p]; });
      if (taken.length) {
        x.ok = false;
        x.warnings.push(taken.map(function (p) { return nameOf[p]; }).join(', ') + '에 이미 예약이 있어요');
      } else {
        x.score += 40;
        x.reasons.push(want.map(function (p) { return nameOf[p]; }).join(', ') + ' 비어 있음');
      }
    }

    if (people) {
      if (!r.capacity) {
        x.warnings.push('수용 인원 정보가 없어요');
      } else if (r.capacity < people) {
        x.ok = false;
        x.warnings.push('정원 ' + r.capacity + '명으로 ' + people + '명이 쓰기에는 좁아요');
      } else {
        var ratio = people / r.capacity;
        if (ratio >= 0.5) {
          x.score += 25;
          x.reasons.push(people + '명에게 알맞은 크기 (정원 ' + r.capacity + '명)');
        } else if (ratio >= 0.25) {
          x.score += 12;
          x.reasons.push(people + '명이 여유 있게 사용 (정원 ' + r.capacity + '명)');
        } else {
          x.score += 3;
          x.reasons.push('수용은 되지만 인원에 비해 큰 공간 (정원 ' + r.capacity + '명)');
        }
      }
    }

    if (purpose) {
      if (looseMatch_(r.uses, purpose)) {
        x.score += 30;
        x.reasons.push("'" + purpose + "' 용도로 쓰는 공간");
      } else {
        x.score -= 5;
        x.warnings.push("'" + purpose + "' 용도로 등록된 공간은 아니에요");
      }
    }

    needs.forEach(function (f) {
      if (looseMatch_(r.facilities, f)) {
        x.score += 15;
        x.reasons.push(f + ' 있음');
      } else {
        x.ok = false;
        x.score -= 15;
        x.warnings.push(f + ' 없음');
      }
    });

    words.forEach(function (w) {
      var where = looseMatch_([r.name], w) ? '이름'
        : looseMatch_(r.uses, w) ? '용도'
        : looseMatch_(r.facilities, w) ? '시설'
        : (r.note + ' ' + r.desc).toLowerCase().indexOf(w.toLowerCase()) >= 0 ? '소개' : '';
      if (where) {
        x.score += 10;
        x.reasons.push("검색어 '" + w + "'가 " + where + '에 있음');
      }
    });

    if (r.note && x.ok) x.warnings.push('특이사항: ' + r.note);
    x.capacity = r.capacity;
    x.name = r.name;
    out.push(x);
  });

  out.sort(function (a, b) {
    if (a.ok !== b.ok) return a.ok ? -1 : 1;
    if (a.score !== b.score) return b.score - a.score;
    if (a.capacity !== b.capacity) return (a.capacity || 1e9) - (b.capacity || 1e9);
    return a.name < b.name ? -1 : 1;
  });
  out.forEach(function (x) { delete x.capacity; delete x.name; });
  return out;
}

/* ---------- 기존 사용 대장 자동 가져오기 (계산 부분) ---------- */

var SYNC_MEMO_ = '기존 사용 대장에서 옮김';
// 대장의 C~K 칸과 그 뒤 한 칸(L) → 교시 이름. 시간대로 적힌 대장도 같은 자리의 교시로 옮깁니다.
var SYNC_SLOTS_ = ['1교시', '2교시', '3교시', '4교시', '점심', '5교시', '6교시', '7교시', '방과후', '야간'];

/** 대장에서 옮겨 온 예약인지 */
function isLedger_(b) { return String(b.id).indexOf('L-') === 0 && b.memo === SYNC_MEMO_; }

function ledgerKey_(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/[\s()\[\]{}（）·・.,_\-\/]/g, '');
}

/** 이름에서 찾을 열쇠들: 전체, 괄호 밖, 괄호 안, 끝의 '실'을 뗀 것 */
function ledgerNames_(name) {
  var keys = [ledgerKey_(name)];
  var m = /^(.*?)[(（](.*?)[)）]\s*$/.exec(String(name));
  if (m) { keys.push(ledgerKey_(m[1])); keys.push(ledgerKey_(m[2])); }
  keys.slice().forEach(function (k) { if (/실$/.test(k)) keys.push(k.slice(0, -1)); });
  return keys.filter(function (k, i) { return k.length >= 2 && keys.indexOf(k) === i; });
}

// 대장의 시트 이름과 [공간] 탭의 이름이 다른 곳: 대장 시트 이름 → 공간 이름
// ([설정] 탭에 '대장짝:시트이름' 줄을 넣어 더하거나 바꿀 수 있습니다.)
var SYNC_ALIASES_ = { '스쿨캠핑': '작은정원' };

/**
 * 대장의 시트 이름마다 [공간] 탭의 줄을 찾습니다.
 * rooms = [{id, name}], aliases = {대장 시트 이름: 공간 이름} → [{title, room | null, how}]
 */
function ledgerMatchRooms_(titles, rooms, aliases) {
  var rs = rooms.map(function (r) { return { id: r.id, name: r.name, keys: ledgerNames_(r.name) }; });
  var out = titles.map(function (t) { return { title: t, keys: ledgerNames_(t), room: null, how: '' }; });
  var used = {};
  var take = function (m, hit, how) {
    if (hit.length === 1) { m.room = { id: hit[0].id, name: hit[0].name }; m.how = how; used[hit[0].id] = true; }
    else if (hit.length > 1) m.how = '이름이 비슷한 공간이 ' + hit.length + '개';
  };
  // 0) 따로 정해 둔 짝 (대장 시트 이름과 공간 이름이 다른 곳). 정해 둔 공간이 없으면 아래 규칙으로 찾습니다.
  var alias = {};
  Object.keys(aliases || {}).forEach(function (k) { alias[ledgerKey_(k)] = ledgerKey_(aliases[k]); });
  out.forEach(function (m) {
    var want = alias[m.keys[0]];
    if (!want) return;
    var hit = rs.filter(function (r) { return !used[r.id] && r.keys.indexOf(want) >= 0; });
    if (hit.length === 1) take(m, hit, '정해 둔 짝');
  });
  // 1) 전체 이름이 같은 것
  out.forEach(function (m) {
    if (m.room) return;
    take(m, rs.filter(function (r) { return !used[r.id] && r.keys[0] === m.keys[0]; }), '이름 일치');
  });
  // 2) 괄호 안팎·'실'을 뗀 이름이 같은 것
  out.forEach(function (m) {
    if (m.room || m.how) return;
    take(m, rs.filter(function (r) {
      return !used[r.id] && r.keys.some(function (k) { return m.keys.indexOf(k) >= 0; });
    }), '이름 일치');
  });
  // 3) 이름이 들어 있는 것 — 후보가 하나뿐이고, 그 공간을 노리는 다른 시트가 없을 때만
  out.forEach(function (m) {
    if (m.room || m.how) return;
    var k = m.keys[0];
    var near = function (key, r) { return r.keys[0].length >= 3 && (r.keys[0].indexOf(key) >= 0 || key.indexOf(r.keys[0]) >= 0); };
    var hit = rs.filter(function (r) { return !used[r.id] && near(k, r); });
    if (hit.length === 1) {
      var rivals = out.filter(function (o) { return o !== m && !o.room && near(o.keys[0], hit[0]); });
      if (rivals.length) return;
    }
    take(m, hit, '비슷한 이름');
  });
  return out.map(function (m) { return { title: m.title, room: m.room, how: m.how }; });
}

/**
 * 대장 한 시트의 줄들 → 날짜별 칸 내용.
 * grid = [[날짜('yyyy-MM-dd' 또는 ''), 칸0 … 칸9], …]  (위에서 아래 순서)
 * from 이후 날짜만. 같은 날짜가 두 번 나오면 아래쪽 줄만 씁니다 (위쪽은 지난 학년도).
 */
function ledgerRows_(grid, from) {
  var days = {};
  grid.forEach(function (row) {
    var d = row[0];
    if (!isDate_(d) || d < from) return;
    days[d] = SYNC_SLOTS_.map(function (x, i) {
      return String(row[i + 1] == null ? '' : row[i + 1]).split(/\s+/).filter(Boolean).join(' ').slice(0, 100);
    });
  });
  return Object.keys(days).sort().map(function (d) { return { date: d, slots: days[d] }; });
}

/** 날짜별 칸 내용 → 예약들. 이어진 칸에 같은 내용이 있으면 한 건으로 묶습니다. */
function ledgerBookings_(rows, roomId, slotIds) {
  var out = [];
  rows.forEach(function (r) {
    var i = 0;
    while (i < r.slots.length) {
      if (!r.slots[i]) { i++; continue; }
      var j = i;
      while (j + 1 < r.slots.length && r.slots[j + 1] === r.slots[i]) j++;
      var ids = slotIds.slice(i, j + 1);
      out.push({
        id: 'L-' + roomId + '-' + r.date.replace(/-/g, '') + '-' + ids[0],
        roomId: roomId, date: r.date, periods: ids, purpose: r.slots[i]
      });
      i = j + 1;
    }
  });
  return out;
}

/** 지금 [예약] 탭에 있는 대장 예약(existing)과 대장에서 방금 읽은 것(desired)의 차이 */
function ledgerDiff_(existing, desired) {
  var have = {}, want = {};
  existing.forEach(function (b) { have[b.id] = b; });
  desired.forEach(function (b) { want[b.id] = b; });
  var same = function (a, b) {
    return a.roomId === b.roomId && a.date === b.date && a.purpose === b.purpose &&
      a.periods.join(',') === b.periods.join(',') && a.status === '확정';
  };
  return {
    add: desired.filter(function (b) { return !have[b.id]; }),
    remove: existing.filter(function (b) { return !want[b.id]; }),
    change: desired.filter(function (b) { return have[b.id] && !same(have[b.id], b); })
      .map(function (b) { return { before: have[b.id], after: b }; })
  };
}

/**
 * 적힌 글에서 사용 학교(중·고·법인)를 짐작합니다. 알 수 없으면 ''.
 * 예: "중학교 법교육" → 중, "동아리(고)" → 고, "중3 리허설" → 중, "고/수업(음악과)" → 고, "중+고 합동" → 중,고
 * "중간고사", "집중", "고사" 처럼 낱말 속에 들어 있는 글자는 세지 않습니다.
 */
function inferSchool_(text) {
  var t = ' ' + String(text == null ? '' : text) + ' ';
  var solo = function (ch) {   // 앞뒤가 띄어쓰기·기호·숫자인 한 글자
    return new RegExp('[\\s(\\[,·/+*~]' + ch + '(?=[\\s\\d/\\-+):(\\],·~]|$)').test(t);
  };
  var out = [];
  if (/중학교|중등/.test(t) || solo('중')) out.push('중');
  if (/고등학교|고교/.test(t) || solo('고')) out.push('고');
  if (/법인/.test(t)) out.push('법인');
  return out.join(',');
}

/**
 * from 이후 날짜에서 같은 공간·날짜·교시에 허용 수보다 많이 겹쳐 있는 살아 있는 예약 쌍.
 * capOf(roomId, periodId) = 그 칸에 함께 들어갈 수 있는 예약 수 (없으면 1)
 */
function findClashes_(bookings, from, capOf) {
  var groups = {};
  bookings.forEach(function (b) {
    if (!isActive_(b) || b.date < from) return;
    var k = b.roomId + '|' + b.date;
    (groups[k] || (groups[k] = [])).push(b);
  });
  var out = [];
  Object.keys(groups).sort().forEach(function (k) {
    var g = groups[k];
    for (var i = 0; i < g.length; i++) {
      for (var j = i + 1; j < g.length; j++) {
        var both = g[i].periods.filter(function (p) {
          if (g[j].periods.indexOf(p) < 0) return false;
          var n = g.filter(function (b) { return b.periods.indexOf(p) >= 0; }).length;
          return n > (capOf ? capOf(g[i].roomId, p) : 1);
        });
        if (both.length) out.push({ roomId: g[i].roomId, date: g[i].date, periods: both, a: g[i], b: g[j] });
      }
    }
  });
  return out.sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : 0; });
}

if (typeof module !== 'undefined') {
  module.exports = {
    splitList_: splitList_, isDate_: isDate_, addDays_: addDays_, weekday_: weekday_,
    expandDates_: expandDates_, findConflicts_: findConflicts_, recommend_: recommend_
  };
}

;
/**
 * 학교 공간 대여 — 탭 머리글, 예시 데이터, 처음 설정
 * 시트 메뉴 [공간대여 → 처음 설정]을 한 번 실행하면 필요한 탭이 만들어집니다.
 */

var TABS_ = {
  '공간': ['ID', '건물', '층', '순서', '이름', '수용인원', '용도', '시설', '특이사항', '소개', '사진', '영상', '신청가능', '동시예약수'],
  '사용자': ['이메일', '이름', '역할', '소속'],
  '교시': ['ID', '이름', '시작', '종료'],
  '예약': ['ID', '묶음ID', '공간ID', '날짜', '교시', '이메일', '이름', '역할', '소속', '목적', '인원', '상태', '신청일시', '수정일시', '처리자', '비고', '사용학교', '사용부서', '공동사용'],
  '기록': ['일시', '이메일', '이름', '동작', '예약ID', '공간', '날짜', '내용', '변경전', '변경후'],
  '설정': ['항목', '값', '설명']
};

/** 예시 데이터 — 학교 실정에 맞게 시트에서 고쳐 쓰세요. */

/**
 * 필요한 탭을 만들고, 비어 있으면 예시 데이터를 채웁니다. 여러 번 실행해도 기존 내용은 지우지 않습니다.
 * 연결된 시트가 없으면(시트 밖에서 만든 프로젝트) "학교 공간 대여" 시트를 새로 만들어 연결합니다.
 * 끝나면 아래 [실행 로그]에 시트 주소가 나옵니다.
 */
function setup() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) {
    var props = PropertiesService.getScriptProperties();
    var id = props.getProperty('SHEET_ID');
    if (id) {
      ss = SpreadsheetApp.openById(id);
    } else {
      ss = SpreadsheetApp.create('학교 공간 대여');
      props.setProperty('SHEET_ID', ss.getId());
    }
  }
  Object.keys(TABS_).forEach(function (name) {
    var head = TABS_[name];
    var sh = ss.getSheetByName(name) || ss.insertSheet(name);
    sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).setNumberFormat('@');
    if (sh.getLastRow() === 0) {
      sh.getRange(1, 1, 1, head.length).setValues([head]);
    } else {
      // 이미 쓰던 탭이면, 새로 생긴 머리글만 오른쪽 끝에 덧붙입니다 (기존 내용은 그대로).
      var have = sh.getRange(1, 1, 1, sh.getLastColumn()).getDisplayValues()[0].map(function (h) { return String(h).trim(); });
      var missing = head.filter(function (h) { return have.indexOf(h) < 0; });
      if (missing.length) {
        var at = sh.getLastColumn() + 1;
        if (sh.getMaxColumns() < at + missing.length - 1) sh.insertColumnsAfter(sh.getMaxColumns(), at + missing.length - 1 - sh.getMaxColumns());
        sh.getRange(1, at, 1, missing.length).setNumberFormat('@').setValues([missing]);
      }
    }
    var width = sh.getLastColumn();
    sh.getRange(1, 1, 1, width).setFontWeight('bold').setBackground('#1c7c45').setFontColor('#ffffff');
    sh.setFrozenRows(1);
    if (sh.getLastRow() === 1 && SAMPLE_[name]) {
      sh.getRange(2, 1, SAMPLE_[name].length, head.length).setValues(SAMPLE_[name]);
    }
  });

  // [공간] 여러 팀이 함께 쓰는 곳은 동시예약수가 비어 있으면 3을 넣습니다 (다른 숫자를 적어 두었으면 그대로 둡니다).
  var rooms = ss.getSheetByName('공간');
  var rHead = rooms.getRange(1, 1, 1, rooms.getLastColumn()).getDisplayValues()[0].map(function (h) { return String(h).trim(); });
  var cName = rHead.indexOf('이름'), cMulti = rHead.indexOf('동시예약수');
  if (cName >= 0 && cMulti >= 0 && rooms.getLastRow() > 1) {
    var rv = rooms.getRange(2, 1, rooms.getLastRow() - 1, rooms.getLastColumn()).getDisplayValues();
    rv.forEach(function (r, i) {
      if (/^(체육관|동진실|작은정원|스쿨캠핑)$/.test(String(r[cName]).trim()) && !String(r[cMulti]).trim()) {
        rooms.getRange(i + 2, cMulti + 1).setNumberFormat('@').setValue('3');
      }
    });
  }

  // [설정] 새로 생긴 항목이 없으면 줄을 덧붙입니다.
  var conf = ss.getSheetByName('설정');
  var keys = conf.getLastRow() > 1 ? conf.getRange(2, 1, conf.getLastRow() - 1, 1).getDisplayValues().map(function (r) { return String(r[0]).trim(); }) : [];
  var extra = SAMPLE_['설정'].filter(function (r) { return keys.indexOf(r[0]) < 0; });
  if (extra.length) conf.getRange(conf.getLastRow() + 1, 1, extra.length, 3).setNumberFormat('@').setValues(extra);

  var users = ss.getSheetByName('사용자');
  if (users.getLastRow() === 1) {
    users.getRange(2, 1, 1, 4).setValues([[Session.getEffectiveUser().getEmail(), '관리자', '관리자', '']]);
  }
  users.getRange('C2:C').setDataValidation(
    SpreadsheetApp.newDataValidation().requireValueInList(['교직원', '학생', '관리자'], true).build());
  ss.getSheetByName('공간').getRange('M2:M').setDataValidation(
    SpreadsheetApp.newDataValidation().requireValueInList(['Y', 'N'], true).build());

  ['예약', '기록'].forEach(function (name) {
    var sh = ss.getSheetByName(name);
    if (!sh.getProtections(SpreadsheetApp.ProtectionType.SHEET).length) {
      sh.protect().setDescription('웹앱이 자동으로 쓰는 탭입니다').setWarningOnly(true);
    }
  });

  var first = ss.getSheetByName('시트1') || ss.getSheetByName('Sheet1');
  if (first && first.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(first);

  SpreadsheetApp.flush();
  var made = ss.getSheets().map(function (s) { return s.getName(); }).join(', ');
  console.log('설정이 끝났습니다. 탭: ' + made);
  console.log('구글시트 주소: ' + ss.getUrl());
  try {
    SpreadsheetApp.getUi().alert('설정이 끝났습니다.\n\n1) [사용자] 탭에 교직원·학생 계정을 등록하세요.\n2) [공간] 탭을 학교에 맞게 고치세요.\n3) 앱스크립트 편집기 오른쪽 위 [배포 → 새 배포]로 웹앱을 배포하세요.');
  } catch (e) {
    // 시트 화면이 열려 있지 않으면 알림 창을 띄울 수 없습니다. 실행 로그의 주소로 시트를 여세요.
  }
}

function settings_() {
  var s = {};
  readTab_('설정').forEach(function (r) { s[r['항목']] = r['값']; });
  return {
    school: s['학교이름'] || '우리 학교',
    notice: s['안내문'] || '',
    maxDays: Math.max(1, parseInt(s['예약가능일수'], 10) || 60),
    repeatMaxDays: Math.max(1, parseInt(s['반복예약최대일수'], 10) || 200),
    admin: s['관리자'] || '',                                         // 화면 위쪽에 보이는 관리자 이름
    notify: !/^(n|no|x|아니오)$/i.test(String(s['함께사용알림'] || 'Y').trim())   // 함께 사용 알림 메일
  };
}

function me_() {
  var email = currentEmail_();
  var me = { email: email, name: '', role: '', dept: '', registered: false, admin: false };
  if (!email) return me;
  var row = readTab_('사용자').filter(function (u) {
    return String(u['이메일']).toLowerCase() === email;
  })[0];
  if (!row) return me;
  var role = String(row['역할'] || '');
  me.role = role.indexOf('관리') >= 0 ? '관리자' : role.indexOf('학생') >= 0 ? '학생' : '교직원';
  me.name = row['이름'] || email.split('@')[0];
  me.dept = row['소속'] || '';
  me.registered = true;
  me.admin = me.role === '관리자';
  return me;
}

function rooms_() {
  return readTab_('공간').filter(function (r) { return r['ID'] && r['이름']; }).map(function (r) {
    return {
      id: r['ID'],
      building: r['건물'] || '본관',
      floor: r['층'] || '1',
      order: parseFloat(r['순서']) || 0,
      name: r['이름'],
      capacity: parseInt(r['수용인원'], 10) || 0,
      uses: splitList_(r['용도']),
      facilities: splitList_(r['시설']),
      note: r['특이사항'] || '',
      desc: r['소개'] || '',
      photos: splitList_(r['사진']),
      video: r['영상'] || '',
      bookable: !/^(n|no|x|아니오|불가)$/i.test(String(r['신청가능'] || 'Y').trim()),
      multi: Math.max(1, parseInt(r['동시예약수'], 10) || 1)   // 같은 시간에 함께 쓸 수 있는 팀 수
    };
  });
}

function periods_() {
  return readTab_('교시').filter(function (r) { return r['ID'] && r['이름']; }).map(function (r) {
    return { id: r['ID'], name: r['이름'], start: hhmm_(r['시작']), end: hhmm_(r['종료']) };
  });
}

function hhmm_(s) {
  var m = /(\d{1,2}):(\d{2})/.exec(String(s || ''));
  return m ? pad2_(+m[1]) + ':' + m[2] : '';
}

function bookings_() {
  return readTab_('예약').filter(function (r) { return r['ID']; }).map(function (r) {
    return {
      _row: r._row,
      id: r['ID'], groupId: r['묶음ID'] || '', roomId: r['공간ID'], date: r['날짜'],
      periods: splitList_(r['교시']),
      email: String(r['이메일'] || '').toLowerCase(), name: r['이름'] || '', role: r['역할'] || '', dept: r['소속'] || '',
      purpose: r['목적'] || '', people: parseInt(r['인원'], 10) || 0, status: r['상태'] || '',
      createdAt: r['신청일시'] || '', updatedAt: r['수정일시'] || '', handler: r['처리자'] || '', memo: r['비고'] || '',
      school: r['사용학교'] || '', unit: r['사용부서'] || '', shared: r['공동사용'] === 'Y'
    };
  });
}

function bookingRow_(b) {
  var row = {
    'ID': b.id, '묶음ID': b.groupId, '공간ID': b.roomId, '날짜': b.date, '교시': b.periods.join(','),
    '이메일': b.email, '이름': b.name, '역할': b.role, '소속': b.dept,
    '목적': b.purpose, '인원': b.people, '상태': b.status,
    '신청일시': b.createdAt, '수정일시': b.updatedAt, '처리자': b.handler, '비고': b.memo,
    '사용학교': b.school || '', '사용부서': b.unit || '', '공동사용': b.shared ? 'Y' : ''
  };
  if (b._row) row._row = b._row;
  return row;
}

/** 화면으로 내보내는 예약. 등록되지 않은 계정에는 이름과 목적을 가립니다. */
function publicBooking_(b, me) {
  var open = me.registered;
  return {
    id: b.id, groupId: b.groupId, roomId: b.roomId, date: b.date, periods: b.periods, status: b.status,
    name: open ? b.name : '', dept: open ? b.dept : '', role: open ? b.role : '',
    purpose: open ? b.purpose : '', people: open ? b.people : 0,
    memo: open ? b.memo : '', createdAt: open ? b.createdAt : '', ledger: isLedger_(b),
    school: open ? b.school : '', unit: open ? b.unit : '', shared: !!b.shared,
    mine: !!me.email && b.email === me.email
  };
}

function byDateThenPeriod_(order) {
  return function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (order[a.periods[0]] || 0) - (order[b.periods[0]] || 0);
  };
}

function periodOrder_(periods) {
  var o = {};
  periods.forEach(function (p, i) { o[p.id] = i + 1; });
  return o;
}

function periodNames_(ids, periods) {
  var n = {};
  periods.forEach(function (p) { n[p.id] = p.name; });
  return ids.map(function (id) { return n[id] || id; }).join(', ');
}

function roomLabel_(room) {
  return room ? room.building + ' ' + floorLabel_(room.floor) + ' ' + room.name : '(삭제된 공간)';
}

function floorLabel_(f) {
  var m = /^[Bb](\d+)$/.exec(f);
  if (m) return '지하 ' + m[1] + '층';
  return /^\d+$/.test(f) ? f + '층' : f;
}

/* ---------- 기록 ---------- */

function snapshot_(b) {
  return JSON.stringify({
    공간ID: b.roomId, 날짜: b.date, 교시: b.periods.join(','), 사용학교: b.school || '', 사용부서: b.unit || '',
    목적: b.purpose, 인원: b.people, 함께사용: b.shared ? 'Y' : '', 상태: b.status, 신청자: b.name, 비고: b.memo
  });
}

function logRow_(me, action, before, after, ctx) {
  var b = after || before;
  var room = ctx.rooms.filter(function (r) { return r.id === b.roomId; })[0];
  return {
    '일시': nowStr_(), '이메일': me.email, '이름': me.name, '동작': action,
    '예약ID': b.id, '공간': roomLabel_(room), '날짜': b.date,
    '내용': periodNames_(b.periods, ctx.periods) + ' · ' + (b.school ? '[' + b.school + '] ' : '') + (b.unit ? b.unit + ' · ' : '') + b.purpose + (b.shared ? ' (함께 사용)' : '') + (b.people ? ' · ' + b.people + '명' : '') + ' · 신청자 ' + b.name + ' · ' + b.status,
    '변경전': before ? snapshot_(before) : '', '변경후': after ? snapshot_(after) : ''
  };
}

/* ---------- 읽기 API ---------- */

function getInit() {
  var me = me_();
  var now = nowStr_();
  var out = {
    me: me, settings: settings_(), rooms: rooms_(), periods: periods_(),
    today: today_(), now: now.slice(11, 16)
  };
  out.ledgerOn = ledgerOn_();
  if (me.admin) out.sheetUrl = sheetUrl_();
  return out;
}

/** 하루치 살아 있는 예약 (확정·승인대기) */
function getDay(date) {
  if (!isDate_(date)) throw new Error('날짜가 올바르지 않아요.');
  var me = me_();
  return bookings_().filter(function (b) { return b.date === date && isActive_(b); })
    .map(function (b) { return publicBooking_(b, me); });
}

/** 한 공간의 기간(최대 1년) 안 살아 있는 예약 — 주간·월간·분기·연간 일정 요약용 */
function getRoomRange(roomId, from, to) {
  if (!isDate_(from) || !isDate_(to) || to < from) throw new Error('기간이 올바르지 않아요.');
  if (toUtc_(to) - toUtc_(from) > 370 * 86400000) throw new Error('한 번에 1년까지만 볼 수 있어요.');
  var me = me_();
  var order = periodOrder_(periods_());
  return bookings_().filter(function (b) {
    return b.roomId === roomId && b.date >= from && b.date <= to && isActive_(b);
  }).sort(byDateThenPeriod_(order)).map(function (b) { return publicBooking_(b, me); });
}

/** 조건에 맞는 공간을 이유와 함께 추천합니다. */
function recommend(q) {
  q = q || {};
  if (!isDate_(q.date)) throw new Error('날짜를 골라 주세요.');
  var day = bookings_().filter(function (b) { return b.date === q.date; });
  return recommend_(rooms_(), day, periods_(), q);
}

function myBookings() {
  var me = me_();
  if (!me.registered) return [];
  var from = addDays_(today_(), -365);   // 지난 1년 치까지 보여 줌
  var order = periodOrder_(periods_());
  return bookings_().filter(function (b) { return b.email === me.email && b.date >= from; })
    .sort(byDateThenPeriod_(order))
    .map(function (b) { return publicBooking_(b, me); });
}

/**
 * [공간] 탭에 등록된 드라이브 사진을 서버가 대신 읽어 돌려줍니다.
 * 사진이 "링크가 있는 모든 사용자"로 공유되어 있지 않아도, 배포한 계정이 볼 수 있으면 화면에 보입니다.
 * [공간] 탭에 적힌 사진만 읽을 수 있습니다.
 */
function getPhoto(fileId) {
  var id = String(fileId || '');
  var listed = rooms_().some(function (r) {
    return r.photos.some(function (u) { return driveId_(u) === id; });
  });
  if (!id || !listed) throw new Error('[공간] 탭에 등록된 사진이 아니에요.');
  return photoData_(id);
}

/* ---------- 쓰기 API ---------- */

function requireUser_() {
  var me = me_();
  if (!me.email) throw new Error('로그인한 계정을 확인할 수 없어요. 학교 구글 계정으로 로그인했는지 확인해 주세요.');
  if (!me.registered) throw new Error('등록되지 않은 계정(' + me.email + ')이에요. 관리자에게 등록을 요청해 주세요.');
  return me;
}

function requireAdmin_() {
  var me = requireUser_();
  if (!me.admin) throw new Error('관리자만 할 수 있어요.');
  return me;
}

var SCHOOLS_ = ['중', '고', '법인'];

var MAX_ROOMS_AT_ONCE = 12;   // 한 번에 함께 신청할 수 있는 공간 수
var MAX_BOOKINGS_AT_ONCE = 240;   // 한 번에 만들 수 있는 예약 수 (공간 수 × 날짜 수)

/**
 * 한 칸(공간·날짜·교시)에 함께 들어갈 수 있는 예약 수.
 * [공간] 탭의 '동시예약수'가 2 이상인 공간은 '함께 사용'으로 신청한 예약이 그 수까지 들어갑니다.
 */
function slotCap_(room, shared) {
  return room && room.multi > 1 && shared ? room.multi : 1;
}

/** 같은 공간·날짜에서 want 교시 중 이미 꽉 찬 교시와, 겹치는 기존 예약들 */
function slotCheck_(all, room, date, want, shared, excludeId) {
  var same = all.filter(function (b) { return isActive_(b) && b.id !== excludeId && b.roomId === room.id && b.date === date; });
  var cap = slotCap_(room, shared);
  return {
    full: want.filter(function (p) {
      return same.filter(function (b) { return b.periods.indexOf(p) >= 0; }).length >= cap;
    }),
    over: same.filter(function (b) { return b.periods.some(function (p) { return want.indexOf(p) >= 0; }); })
  };
}

function dateLabel_(d) {
  var p = d.split('-');
  return (+p[1]) + '월 ' + (+p[2]) + '일(' + WEEKDAY_NAMES_[weekday_(d)] + ')';
}

function checkPeople_(people, room) {
  if (room.capacity && people > room.capacity) {
    throw new Error(room.name + '의 정원은 ' + room.capacity + '명이에요. 인원을 줄이거나 더 큰 공간을 골라 주세요.');
  }
}

/** 교시·사용학교·부서·목적·인원을 확인하고 정리해서 돌려줍니다. */
function cleanInput_(data, periods) {
  var order = periodOrder_(periods);
  var seen = {};
  var list = (data.periods || []).map(String).filter(function (p) {
    if (!order[p] || seen[p]) return false;
    seen[p] = true;
    return true;
  }).sort(function (a, b) { return order[a] - order[b]; });
  if (!list.length) throw new Error('사용할 교시를 한 개 이상 골라 주세요.');

  var asked = Array.isArray(data.school) ? data.school : splitList_(data.school);
  var school = SCHOOLS_.filter(function (x) { return asked.indexOf(x) >= 0; });
  if (!school.length) throw new Error('사용 학교(중·고·법인)를 한 개 이상 골라 주세요.');
  var unit = String(data.unit || '').trim().slice(0, 40);
  if (!unit) throw new Error('사용 부서를 적어 주세요. 개인이면 선생님 성함을 적어 주세요.');

  var purpose = String(data.purpose || '').trim().slice(0, 100);
  if (!purpose) throw new Error('사용 목적을 적어 주세요.');

  var people = parseInt(data.people, 10);
  if (!(people >= 1)) throw new Error('사용 예상 인원을 숫자로 적어 주세요.');
  return { periods: list, purpose: purpose, people: people, school: school.join(','), unit: unit };
}

/**
 * 예약 신청. 여러 공간을 같은 일정으로 한 번에 신청할 수 있습니다.
 * data = {roomId | roomIds[], date, periods[], school[], unit, purpose, people, shared,
 *         repeat: {until, weekdays[]} | null, skipConflicts, ackExisting}
 * - 반복 신청에서 자리가 없는 날(conflicts)이 있거나, 함께 사용으로 이미 다른 예약이 있는 시간(existing)에 신청하면
 *   {needConfirm, conflicts, existing, okCount} 를 돌려주고 아무것도 만들지 않습니다.
 *   skipConflicts·ackExisting 을 true 로 다시 부르면 자리가 없는 날을 빼고 만듭니다.
 * - 한 번에 두 건 이상 만들면 같은 묶음ID 를 주어 나중에 한꺼번에 취소할 수 있습니다.
 * - 함께 사용으로 들어가면 먼저 예약한 사람에게 메일로 알립니다.
 */
function createBooking(data) {
  data = data || {};
  return withLock_(function () {
    var me = requireUser_();
    var conf = settings_();
    var periods = periods_();
    var rooms = rooms_();
    var today = today_();

    var ids = [];
    (Array.isArray(data.roomIds) && data.roomIds.length ? data.roomIds : [data.roomId]).forEach(function (id) {
      id = String(id == null ? '' : id);
      if (id && ids.indexOf(id) < 0) ids.push(id);
    });
    if (!ids.length) throw new Error('공간을 찾을 수 없어요.');
    if (ids.length > MAX_ROOMS_AT_ONCE) throw new Error('한 번에 ' + MAX_ROOMS_AT_ONCE + '곳까지만 함께 신청할 수 있어요.');
    var targets = ids.map(function (id) {
      var room = rooms.filter(function (r) { return r.id === id; })[0];
      if (!room) throw new Error('공간을 찾을 수 없어요.');
      if (!room.bookable) throw new Error(room.name + '은(는) 신청을 받지 않는 공간이에요.');
      return room;
    });
    var many = targets.length > 1;

    if (!isDate_(data.date)) throw new Error('날짜가 올바르지 않아요.');
    if (data.date < today) throw new Error('지난 날짜는 신청할 수 없어요.');
    if (data.date > addDays_(today, conf.maxDays)) {
      throw new Error('오늘부터 ' + conf.maxDays + '일 뒤까지만 신청할 수 있어요.');
    }
    var input = cleanInput_(data, periods);
    targets.forEach(function (room) { checkPeople_(input.people, room); });
    var heads = tabHeaders_('예약');
    if (heads.indexOf('사용학교') < 0 || heads.indexOf('사용부서') < 0 || heads.indexOf('공동사용') < 0) {
      throw new Error("[예약] 탭에 '사용학교'·'사용부서'·'공동사용' 열이 없어요. 관리자가 앱스크립트 편집기에서 setup 을 한 번 더 실행해야 해요.");
    }

    var dates = [data.date];
    if (data.repeat) {
      var until = data.repeat.until;
      var days = (data.repeat.weekdays || []).map(Number).filter(function (d) { return d >= 0 && d <= 6; });
      if (!isDate_(until) || until < data.date) throw new Error('반복 종료일은 시작일과 같거나 그 뒤여야 해요.');
      if (until > addDays_(today, conf.repeatMaxDays)) {
        throw new Error('반복 종료일은 오늘부터 ' + conf.repeatMaxDays + '일 뒤까지만 정할 수 있어요.');
      }
      if (!days.length) throw new Error('반복할 요일을 한 개 이상 골라 주세요.');
      dates = expandDates_(data.date, until, days);
      if (!dates.length) throw new Error('고른 기간 안에 해당 요일이 없어요.');
      if (dates.length > MAX_REPEAT_COUNT) {
        throw new Error('한 번에 ' + MAX_REPEAT_COUNT + '회까지만 반복할 수 있어요. (지금 ' + dates.length + '회) 기간을 줄여 주세요.');
      }
    }
    if (dates.length * targets.length > MAX_BOOKINGS_AT_ONCE) {
      throw new Error('한 번에 ' + MAX_BOOKINGS_AT_ONCE + '건까지만 신청할 수 있어요. (지금 ' + (dates.length * targets.length) + '건) 공간이나 기간을 줄여 주세요.');
    }

    var all = bookings_();
    var plan = [];        // 만들 예약: {room, date, shared, over[]}
    var conflicts = [];   // 자리가 없어 신청할 수 없는 곳
    var existing = [];    // 신청은 되지만 같은 시간에 이미 다른 예약이 있는 곳 (함께 사용)
    var hint = '';
    targets.forEach(function (room) {
      var shared = !!data.shared && room.multi > 1;
      dates.forEach(function (d) {
        var c = slotCheck_(all, room, d, input.periods, shared);
        if (c.full.length) {
          conflicts.push({ room: room.name, date: d, periods: periodNames_(c.full, periods) });
          if (!hint) {
            hint = shared ? '이미 ' + room.multi + '팀이 예약해서 자리가 없어요.'
              : room.multi > 1 && !slotCheck_(all, room, d, input.periods, true).full.length
                ? "다른 팀과 함께 쓰는 경우라면 '함께 사용'에 체크해 주세요. (최대 " + room.multi + '팀)'
                : '다른 교시나 공간을 골라 주세요.';
          }
          return;
        }
        plan.push({ room: room, date: d, shared: shared, over: c.over });
        if (c.over.length) {
          existing.push({
            room: room.name, date: d, max: room.multi,
            list: c.over.map(function (b) {
              return { periods: periodNames_(b.periods, periods), who: b.unit || b.name, school: b.school, purpose: b.purpose };
            })
          });
        }
      });
    });

    if (conflicts.length && !data.repeat) {
      throw new Error((many ? conflicts[0].room + ' ' : '') + conflicts[0].periods + '에 이미 예약이 있어요. ' + hint +
        (many ? ' (아무 공간도 신청하지 않았어요.)' : ''));
    }
    if (!plan.length) throw new Error('고른 날짜 모두 이미 예약이 있어요.');
    if ((conflicts.length && !data.skipConflicts) || (existing.length && !data.ackExisting)) {
      return { needConfirm: true, conflicts: conflicts, existing: existing, okCount: plan.length, many: many };
    }

    var status = me.role === '학생' ? '승인대기' : '확정';
    var now = nowStr_();
    var ctx = { rooms: rooms, periods: periods };
    var groupId = plan.length > 1 ? 'G' + newId_() : '';
    var made = plan.map(function (x) {
      return {
        id: 'R' + newId_(), groupId: groupId, roomId: x.room.id, date: x.date, periods: input.periods,
        email: me.email, name: me.name, role: me.role, dept: me.dept,
        purpose: input.purpose, people: input.people, status: status,
        createdAt: now, updatedAt: '', handler: '', memo: '',
        school: input.school, unit: input.unit, shared: x.shared
      };
    });
    var action = data.repeat ? '반복신청' : many ? '일괄신청' : '신청';
    appendRows_('예약', made.map(bookingRow_));
    appendRows_('기록', made.map(function (b) { return logRow_(me, action, null, b, ctx); }));

    var notified = conf.notify ? notifyShared_(me, input, plan, periods, conf) : 0;
    return { created: made.length, status: status, skipped: conflicts, rooms: targets.length, notified: notified };
  });
}

/**
 * 함께 사용으로 들어간 시간에 먼저 예약해 둔 사람들에게 메일로 알립니다. 보낸 사람 수를 돌려줍니다.
 * 메일을 못 보내도 예약은 그대로 둡니다. (대장에서 가져온 예약은 메일 주소가 없어 알리지 못합니다.)
 */
function notifyShared_(me, input, plan, periods, conf) {
  var byMail = {};
  plan.forEach(function (x) {
    x.over.forEach(function (b) {
      if (!b.email || b.email === me.email) return;
      var both = b.periods.filter(function (p) { return input.periods.indexOf(p) >= 0; });
      (byMail[b.email] || (byMail[b.email] = { name: b.name, lines: [] })).lines.push(
        '- ' + dateLabel_(x.date) + ' ' + x.room.name + ' ' + periodNames_(both, periods) +
        ' (내 예약: ' + (b.unit ? b.unit + ' · ' : '') + b.purpose + ')');
    });
  });
  var sent = 0;
  Object.keys(byMail).forEach(function (to) {
    var m = byMail[to];
    var shown = m.lines.slice(0, 30);
    var body = m.name + ' 님,\n\n예약하신 시간에 다른 팀이 "함께 사용"으로 신청했습니다.\n\n' +
      '신청한 팀: ' + (input.school ? '[' + input.school + '] ' : '') + input.unit + ' (' + me.name + ')\n' +
      '사용 목적: ' + input.purpose + ' · ' + input.people + '명\n\n' +
      '겹치는 시간:\n' + shown.join('\n') + (m.lines.length > shown.length ? '\n… 외 ' + (m.lines.length - shown.length) + '건' : '') + '\n\n' +
      '함께 쓰기 어려운 경우에는 신청한 분이나 관리자' + (conf.admin ? '(' + conf.admin + ')' : '') + '에게 알려 주세요.\n\n' +
      '— ' + conf.school + ' 공간 대여';
    try {
      sendMail_(to, '[' + conf.school + ' 공간 대여] 예약하신 시간에 함께 사용 신청이 들어왔습니다', body);
      sent++;
    } catch (e) {
      // 메일 권한이 없거나 하루 발송 한도를 넘은 경우: 예약은 그대로 둡니다.
    }
  });
  return sent;
}

/** [설정] 탭에 대장 주소가 적혀 있으면 자동 가져오기를 쓰는 것으로 봅니다. */
function ledgerOn_() {
  return readTab_('설정').some(function (r) { return /^대장주소/.test(String(r['항목'])) && String(r['값']).trim(); });
}

/** 대장에서 온 예약은 대장에서만 고칩니다 (웹에서 고쳐도 다음 가져오기 때 대장 값으로 돌아가므로). */
function refuseLedger_(b) {
  if (isLedger_(b) && ledgerOn_()) {
    throw new Error('기존 사용 대장에서 가져온 예약이에요. 대장(구글시트)에서 고치면 자동으로 반영돼요.');
  }
}

function findBooking_(all, id) {
  var b = all.filter(function (x) { return x.id === id; })[0];
  if (!b) throw new Error('예약을 찾을 수 없어요. 화면을 새로 고쳐 주세요.');
  return b;
}

function requireOwner_(b, me, today) {
  if (me.admin) return;
  if (b.email !== me.email) throw new Error('본인이 신청한 예약만 바꿀 수 있어요.');
  if (b.date < today) throw new Error('지난 예약은 바꿀 수 없어요.');
}

/** 예약 수정: 교시·목적·인원. 학생이 교시를 바꾸면 다시 승인 대기가 됩니다. */
function updateBooking(id, data) {
  data = data || {};
  return withLock_(function () {
    var me = requireUser_();
    var periods = periods_();
    var rooms = rooms_();
    var all = bookings_();
    var b = findBooking_(all, id);
    requireOwner_(b, me, today_());
    refuseLedger_(b);
    if (!isActive_(b)) throw new Error('이미 ' + b.status + '된 예약은 고칠 수 없어요.');

    var room = rooms.filter(function (r) { return r.id === b.roomId; })[0];
    if (!room) throw new Error('공간을 찾을 수 없어요.');
    var input = cleanInput_(data, periods);
    checkPeople_(input.people, room);
    var full = slotCheck_(all, room, b.date, input.periods, b.shared, b.id).full;
    if (full.length) throw new Error(periodNames_(full, periods) + '에 이미 다른 예약이 있어요.');

    var before = JSON.parse(JSON.stringify(b));
    var moved = input.periods.join(',') !== b.periods.join(',');
    b.periods = input.periods;
    b.purpose = input.purpose;
    b.people = input.people;
    b.school = input.school;
    b.unit = input.unit;
    b.updatedAt = nowStr_();
    if (moved && b.role === '학생' && !me.admin) {
      b.status = '승인대기';
      b.handler = '';
    }
    updateRows_('예약', [bookingRow_(b)]);
    appendRows_('기록', [logRow_(me, '수정', before, b, { rooms: rooms, periods: periods })]);
    return { status: b.status };
  });
}

/**
 * 예약 취소. scope =
 *   'one'       이 예약만
 *   'following' 같은 묶음·같은 공간에서 이 날부터 남은 일정
 *   'room'      같은 묶음·같은 공간의 오늘 이후 일정 전부 (반복 예약 일괄 취소)
 *   'group'     같은 묶음의 오늘 이후 일정 전부 (함께 신청한 다른 공간까지)
 */
function cancelBooking(id, scope) {
  return withLock_(function () {
    var me = requireUser_();
    var all = bookings_();
    var b = findBooking_(all, id);
    requireOwner_(b, me, today_());
    refuseLedger_(b);
    if (!isActive_(b)) throw new Error('이미 ' + b.status + '된 예약이에요.');

    var targets = [b];
    if (b.groupId && (scope === 'following' || scope === 'room' || scope === 'group')) {
      var from = scope === 'following' ? b.date : today_();
      targets = all.filter(function (x) {
        return x.groupId === b.groupId && isActive_(x) && x.date >= from && (scope === 'group' || x.roomId === b.roomId);
      });
      if (!targets.length) targets = [b];
    }
    var ctx = { rooms: rooms_(), periods: periods_() };
    var now = nowStr_();
    var logs = targets.map(function (x) {
      var before = JSON.parse(JSON.stringify(x));
      x.status = '취소';
      x.updatedAt = now;
      x.handler = me.email === x.email ? '' : me.name;
      return logRow_(me, '취소', before, x, ctx);
    });
    updateRows_('예약', targets.map(bookingRow_));
    appendRows_('기록', logs);
    return { cancelled: targets.length };
  });
}

/* ---------- 관리자 API ---------- */

/** 승인 대기 전체와, 기간 안의 모든 예약 */
function adminBookings(q) {
  var me = requireAdmin_();
  q = q || {};
  var today = today_();
  var from = isDate_(q.from) ? q.from : today;
  var to = isDate_(q.to) ? q.to : addDays_(today, 30);
  var order = periodOrder_(periods_());
  var all = bookings_().sort(byDateThenPeriod_(order));
  var roomOf = {};
  rooms_().forEach(function (r) { roomOf[r.id] = r; });
  var capOf = function (roomId) { return slotCap_(roomOf[roomId], true); };
  var withEmail = function (b) {
    var p = publicBooking_(b, me);
    p.email = b.email;
    p.handler = b.handler;
    return p;
  };
  return {
    from: from, to: to,
    ledgerOn: ledgerOn_(), sync: ledgerStatus_(),
    clashes: findClashes_(all, today, capOf).map(function (c) {
      return { roomId: c.roomId, date: c.date, periods: c.periods, a: withEmail(c.a), b: withEmail(c.b) };
    }),
    pending: all.filter(function (b) { return b.status === '승인대기'; }).map(withEmail),
    list: all.filter(function (b) { return b.date >= from && b.date <= to; }).map(withEmail)
  };
}

/** 승인·반려. scope = 'one' | 'group' (같은 반복 예약의 승인 대기 전체) */
function decide(id, approve, reason, scope) {
  return withLock_(function () {
    var me = requireAdmin_();
    var all = bookings_();
    var b = findBooking_(all, id);
    if (b.status !== '승인대기') throw new Error('승인 대기 중인 예약이 아니에요. (현재: ' + b.status + ')');
    var targets = [b];
    if (scope === 'group' && b.groupId) {
      targets = all.filter(function (x) { return x.groupId === b.groupId && x.status === '승인대기'; });
    }
    var ctx = { rooms: rooms_(), periods: periods_() };
    var now = nowStr_();
    var memo = String(reason || '').trim().slice(0, 100);
    var logs = targets.map(function (x) {
      var before = JSON.parse(JSON.stringify(x));
      x.status = approve ? '확정' : '반려';
      x.updatedAt = now;
      x.handler = me.name;
      if (memo) x.memo = memo;
      return logRow_(me, approve ? '승인' : '반려', before, x, ctx);
    });
    updateRows_('예약', targets.map(bookingRow_));
    appendRows_('기록', logs);
    return { done: targets.length };
  });
}

/** 관리자가 화면에서 누르는 "지금 가져오기" */
function runLedgerSync() {
  requireAdmin_();
  return syncLedger();
}

/** 최근 기록 (새것부터). q = 검색어 */
function getHistory(q) {
  requireAdmin_();
  var word = String(q || '').trim().toLowerCase();

  if (word) {
    rows = rows.filter(function (r) {
      return [r['일시'], r['이메일'], r['이름'], r['동작'], r['공간'], r['날짜'], r['내용']]
        .join(' ').toLowerCase().indexOf(word) >= 0;
    });
  }
  return rows.slice(0, HISTORY_LIMIT).map(function (r) {
    return {
      at: r['일시'], email: r['이메일'], name: r['이름'], action: r['동작'], bookingId: r['예약ID'],
      room: r['공간'], date: r['날짜'], text: r['내용'], before: r['변경전'], after: r['변경후']
    };
  });
}

function loadDay(date, force) {

  return call('getDay', date).then(function (list) { S.days[date] = list; return list; });

function bookingAt(roomId, date, pid) {
  var list = S.days[date] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].roomId === roomId && list[i].periods.indexOf(pid) >= 0) return list[i];
  }

function bookingsAt(roomId, date, pid) {

function slotCap(r) { return r && r.multi > 1 ? r.multi : 1; }
function whoText(b) { return (b.school ? '[' + b.school + '] ' : '') + (b.unit || b.name || ''); }
var SCHOOLS = ['중', '고', '법인'];
function schoolChips(list) {

    var on = list.indexOf(x) >= 0;

  }).join('') + '</div>';
}
function slotClass(b) { return !b ? 'free' : b.mine ? 'mine' : b.status === '확정' ? 'busy' : 'wait'; }
function roomState(r) {
  if (!r.bookable) return { k: 'off', t: '신청 불가' };
  var ps = S.init.periods;
  if (S.period !== 'all') {
    var b = bookingAt(r.id, S.date, S.period);
    if (!b) return { k: 'free', t: '비어 있음' };
    var cap = slotCap(r), cnt = bookingsAt(r.id, S.date, S.period).length;
    if (cap > 1 && cnt < cap) return { k: 'part', t: cnt + '/' + cap + '팀 사용 중 · 함께 사용 가능' };
    if (cap > 1) return { k: 'busy', t: cap + '팀 사용 중 (꽉 참)' };
    if (b.mine) return { k: 'mine', t: b.status === '확정' ? '내 예약' : '내 신청 (승인 대기)' };
    return b.status === '확정' ? { k: 'busy', t: '사용 중' + (whoText(b) ? ' · ' + whoText(b) : '') } : { k: 'wait', t: '승인 대기' };
  }
  var n = ps.filter(function (p) { return bookingAt(r.id, S.date, p.id); }).length;
  if (!n) return { k: 'free', t: '종일 비어 있음' };
  if (n === ps.length) return { k: 'busy', t: '종일 예약' };
  return { k: 'part', t: n + '개 교시 예약' };
}

/** 묶음ID 로 묶습니다. byRoom 이면 같은 묶음이라도 공간마다 따로 묶습니다. */
function groupUp(list, byRoom) {
  var map = {}, out = [];

    var k = b.groupId ? b.groupId + (byRoom ? '|' + b.roomId : '') : b.id;

/** 같은 묶음으로 신청한 예약들 (화면에 불러온 것 가운데) */
function groupMates(b) {
  if (!b.groupId) return [b];
  var seen = {}, out = [];
  var pools = [S.mine || [], S.admin.data ? S.admin.data.list : [], S.admin.data ? S.admin.data.pending : []];
  pools.forEach(function (list) {
    list.forEach(function (x) { if (x.groupId === b.groupId && !seen[x.id]) { seen[x.id] = true; out.push(x); } });
  });
  return out.length ? out : [b];
}

  var later = here.filter(function (x) { return x.date >= b.date; });

  };
  h += btn('one', b.groupId ? '이 날만 취소 (1건)' : '예약 취소');

function findBooking(id) {
  var clash = [];
  if (S.admin.data) S.admin.data.clashes.forEach(function (c) { clash.push(c.a, c.b); });
  var pools = [S.mine || [], S.admin.data ? S.admin.data.list : [], S.admin.data ? S.admin.data.pending : [], clash];
  for (var i = 0; i < pools.length; i++) {
    for (var j = 0; j < pools[i].length; j++) if (pools[i][j].id === id) return pools[i][j];
  }
  return null;
}
function fail(e) {
  if (S.sheet) { S.sheet.busy = false; S.sheet.err = e.message; renderSheet(); }
  else toast(e.message);
}
function setDate(kind, date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  if (kind === 'sheet' && S.sheet) {
    S.sheet.date = date; S.sheet.sel = []; S.sheet.err = ''; S.sheet.confirm = null;
    S.date = date;
    if (S.sheet.f.repeat) { S.sheet.f.days = [wd(date)]; if (S.sheet.f.until < date) S.sheet.f.until = addDays(date, 28); }
    renderSheet();
    loadDay(date).then(renderSheet, fail);
  } else {
    S.date = date;
    render();
    loadDay(date).then(render, fail);
  }
}
function openRoom(id, opt) {
  opt = opt || {};
  var date = opt.date || S.date;
  S.sheet = {
    type: 'room', id: id, date: date, sel: (opt.periods || []).slice(), video: false, err: '', busy: false, confirm: null,
    f: { school: lastUsed('school', []), unit: lastUsed('unit', S.init.me.dept || ''), purpose: opt.purpose || '', people: opt.people || '', shared: false, more: [], moreOpen: false, repeat: false, days: [wd(date)], until: addDays(date, 28) }
  };
  var rm = room(id);
  renderSheet();
  loadDay(date).then(function () {
    if (!S.sheet || S.sheet.id !== id) return;
    S.sheet.sel = S.sheet.sel.filter(function (p) { return bookingsAt(id, date, p).length < slotCap(rm); });
    renderSheet();
  }, fail);
}

  },
  reject: function (el) {
    var b = findBooking(el.dataset.id);
    if (!b) return;
    var items = S.admin.data.pending.filter(function (x) { return (x.groupId || x.id) === (b.groupId || b.id); });
    S.sheet = { type: 'reject', items: items, err: '', busy: false, f: { reason: '' } };
    renderSheet();
  },
  'reject-go': function () {
    var sh = S.sheet;
    sh.busy = true;
    renderSheet();
    call('decide', sh.items[0].id, false, sh.f.reason, 'group').then(function () {
      toast('반려했어요.');
      S.sheet = null;
      return refreshAfterWrite().then(render);
    }).catch(fail);
  },
  'mcal-shift': function (el) {
    var c = S.mineCal, n = +el.dataset.d, d = toDate(c.month || S.init.today);
    c.month = n ? fromDate(new Date(d.getFullYear(), d.getMonth() + n, 1)) : S.init.today.slice(0, 7) + '-01';
    c.day = '';
    render();
  },
  'mcal-day': function (el) { S.mineCal.day = S.mineCal.day === el.dataset.d ? '' : el.dataset.d; render(); },
  'sync-now': function () {
    S.admin.syncing = true;
    render();
    call('runLedgerSync').then(function (msg) {
      S.admin.syncing = false;
      toast('대장 가져오기: ' + msg);
      return refreshAfterWrite().then(render);
    }).catch(function (e) { S.admin.syncing = false; render(); toast(e.message); });
  },
  atab: function (el) {
    S.admin.tab = el.dataset.t;
    render();
    if (S.admin.tab === 'hist' && !S.admin.hist) loadHist().then(render, fail);
    else if (!S.admin.data) loadAdmin().then(render, fail);
  },
  fchip: function (el) {
    var f = S.find, k = el.dataset.k, v = el.dataset.v;
    if (k === 'purpose') f.purpose = f.purpose === v ? '' : v;
    else { var i = f[k].indexOf(v); if (i >= 0) f[k].splice(i, 1); else f[k].push(v); }
    render();
  },
  'rec-open': function (el) {
    var f = S.find;
    openRoom(el.dataset.id, { date: f.date, periods: f.periods, people: f.people, purpose: f.purpose });
  }
};

var FORMS = {
  find: function () {
    var f = S.find;
    if (!f.date) { f.err = '날짜를 골라 주세요.'; render(); return; }
    f.busy = true; f.err = '';
    render();
    call('recommend', { date: f.date, periods: f.periods, people: f.people, purpose: f.purpose, facilities: f.facilities, keyword: f.keyword })
      .then(function (list) {
        f.busy = false; f.results = list;
        render();
        if (window.innerWidth < 900) { var s = $('.findgrid > section'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        else window.scrollTo(0, 0);
      })
      .catch(function (e) { f.busy = false; f.err = e.message; render(); });
  },
  hist: function () { S.admin.hist = null; render(); loadHist().then(render, fail); },
  range: function () { S.admin.data = null; render(); loadAdmin().then(render, fail); }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled || (el.tagName === 'INPUT' && el.type === 'checkbox')) return;
  var fn = A[el.dataset.a];
  if (fn) fn(el);
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset.a === 'repeat') A.repeat(el);
  if (el.dataset.a === 'shared') A.shared(el);
  if (el.dataset.date) setDate(el.dataset.date, el.value);
  if (el.dataset.rerender) renderSheet();
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.dataset.f && S.sheet) S.sheet.f[el.dataset.f] = el.value;
  if (el.dataset.find) S.find[el.dataset.find] = el.value;
  if (el.dataset.admin) S.admin[el.dataset.admin] = el.value;
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var fn = FORMS[e.target.dataset.form];
  if (fn) fn();
});
document.addEventListener('toggle', function (e) {
  var el = e.target;
  if (el && el.dataset && el.dataset.keep && S.sheet && S.sheet.f) S.sheet.f[el.dataset.keep] = el.open;
}, true);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.sheet) A.close();
});

/* 드라이브 사진이 바로 열리지 않으면(공유가 제한된 파일) 서버에 대신 읽어 달라고 합니다. */
document.addEventListener('error', function (e) {
  var el = e.target;
  if (!el || el.tagName !== 'IMG' || !el.dataset.fid || el.dataset.tried) return;
  el.dataset.tried = '1';
  var fid = el.dataset.fid;
  var each = function (fn) { Array.prototype.forEach.call(document.querySelectorAll('img[data-fid="' + fid + '"]'), fn); };
  call('getPhoto', fid).then(function (src) {
    if (!src) throw new Error('empty');
    S.photos[fid] = src;
    each(function (img) { img.dataset.tried = '1'; img.src = src; });
  }).catch(function () {
    S.photos[fid] = 'fail';
    renderSheet();
  });
}, true);

/* 다른 사람의 신청이 보이도록 1분마다, 그리고 화면으로 돌아올 때 새로 읽습니다. */
function quietRefresh() {
  if (!S.init || document.hidden || S.view !== 'map' || (S.sheet && S.sheet.busy)) return;
  var before = JSON.stringify(S.days[S.date] || null);
  call('getDay', S.date).then(function (list) {
    S.days[S.date] = list;
    if (JSON.stringify(list) === before) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'SELECT') return;
    render();
  }).catch(function () {});
}
setInterval(quietRefresh, 60000);
document.addEventListener('visibilitychange', quietRefresh);

/* ---------- 시작 ---------- */
call('getInit').then(function (init) {
  S.init = init;
  S.date = init.today;
  var bs = buildings();
  S.building = bs[0] || '';
  var fs = floorsOf(S.building);
  S.floor = fs.indexOf('1') >= 0 ? '1' : (fs[fs.length - 1] || '');
  var cur = init.periods.filter(function (p) { return p.start && p.end && p.start <= init.now && init.now < p.end; })[0];
  S.period = cur ? cur.id : 'all';
  document.title = init.settings.school + ' 공간 대여';
  var jobs = [loadDay(S.date)];
  if (init.me.admin) jobs.push(loadAdmin());
  return Promise.all(jobs).then(render);
}).catch(function (e) {
  $('#app').innerHTML = '<main><div class="err" role="alert" style="margin-top:40px"><b>화면을 불러오지 못했어요.</b><br>' + esc(e.message) + '</div></main>';
});
</script>
